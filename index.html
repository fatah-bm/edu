<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belajar Yuk!</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 24px 16px;
            text-align: center;
            min-height: 100vh;
        }
        h1 {
            color: #ff6b6b;
            font-size: 34px;
            margin: 0 0 6px 0;
        }
        .subtitle {
            color: #888;
            font-size: 16px;
            margin: 0 0 32px 0;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 560px;
            margin: 0 auto;
        }
        .card {
            background-color: white;
            border-radius: 20px;
            padding: 24px 20px;
            width: 160px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .card:active { transform: translateY(6px); box-shadow: none !important; }
        .card.math {
            border: 4px solid #ff6b6b;
            box-shadow: 0 6px 0 #cc4444;
        }
        .card.english {
            border: 4px solid #4ecdc4;
            box-shadow: 0 6px 0 #36b2aa;
        }
        .card.logika {
            border: 4px solid #9b59b6;
            box-shadow: 0 6px 0 #7a3f88;
        }
        .card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            display: block;
            margin: 0 auto 12px auto;
        }
        .card p {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }
        .card small {
            display: block;
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <h1>Belajar Yuk! 🎉</h1>
    <p class="subtitle">Pilih pelajaran</p>

    <div class="grid">
        <a class="card math" href="./games/math/">
            <img src="https://img.icons8.com/color/96/math.png" alt="Math"
                 onerror="this.style.display='none'">
            <p>Matematika</p>
            <small>Berhitung seru</small>
        </a>
        <a class="card english" href="./games/english/">
            <img src="https://img.icons8.com/color/96/reading.png" alt="English"
                 onerror="this.style.display='none'">
            <p>English</p>
            <small>Kosakata & pelafalan</small>
        </a>
        <a class="card logika" href="./games/logika/">
            <img src="https://img.icons8.com/color/96/brain.png" alt="Logika"
                 onerror="this.style.display='none'">
            <p>Logika</p>
            <small>Asah otak & pikiran</small>
        </a>
    </div>
</body>
</html>
