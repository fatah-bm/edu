<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klasifikasi: Cari yang Beda</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #f0f8ff 0%, #e8f4f8 100%);
            margin: 0;
            padding: 16px;
            text-align: center;
            min-height: 100vh;
        }
        .top-bar {
            display: flex;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 20px auto;
            gap: 8px;
        }
        .btn-back {
            background-color: #c7ceea;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #a0a8c8;
            text-decoration: none;
            color: #333;
        }
        .btn-back:active { transform: translateY(4px); box-shadow: none; }
        .btn-audio {
            background-color: #c7ceea;
            border: none;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 0 #a0a8c8;
            line-height: 1;
        }
        .btn-audio:active { transform: translateY(4px); box-shadow: none; }
        h1 {
            color: #9b59b6;
            font-size: 22px;
            margin: 0;
            flex: 1;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .question {
            font-size: 18px;
            color: #2c3e50;
            margin: 0 0 4px 0;
            font-weight: bold;
        }
        .level-info {
            font-size: 13px;
            color: #999;
            margin: 0 0 20px 0;
        }
        .items-grid {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 0 0 24px 0;
        }
        .item-btn {
            width: 68px;
            height: 68px;
            border: 3px solid #9b59b6;
            border-radius: 14px;
            background: white;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #7a3f88;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .item-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #7a3f88;
        }
        .item-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .item-btn.correct {
            background: #4caf50;
            border-color: #4caf50;
            animation: pulse 0.6s;
        }
        .item-btn.wrong {
            background: #f44336;
            border-color: #f44336;
            animation: shake 0.6s;
        }
        .item-btn:disabled { cursor: not-allowed; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .feedback {
            font-size: 20px;
            margin: 16px 0;
            font-weight: bold;
            height: 30px;
        }
        .feedback.correct { color: #4caf50; }
        .feedback.wrong { color: #f44336; }
        .score {
            font-size: 16px;
            color: #666;
            margin: 16px 0;
        }
        .btn-next {
            background-color: #9b59b6;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #7a3f88;
            color: white;
            margin: 16px 0;
        }
        .btn-next:active { transform: translateY(4px); box-shadow: none; }
        .btn-next:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            box-shadow: 0 4px 0 #999;
        }
        .btn-outline {
            display: inline-block;
            padding: 12px 24px;
            background: white;
            color: #9b59b6;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            border: 3px solid #9b59b6;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="btn-back" href="../">⬅ Back</a>
        <h1>Cari yang Beda</h1>
        <button class="btn-audio" id="audioToggle" onclick="toggleAudio()">🔊</button>
    </div>

    <div class="container" id="container"></div>

    <script>
        const ROUND_SIZE = 8;
        const ITEMS_PER_ROUND = 5;

        // Kelompok berdasarkan kategori (jenis benda)
        const categoryPools = {
            hewan: ['🐶', '🐱', '🐰', '🐻', '🐼', '🐵', '🐸', '🐷'],
            buah: ['🍎', '🍌', '🍇', '🍊', '🍉', '🍓', '🍍', '🥝'],
            kendaraan: ['🚗', '🚕', '🚙', '🚌', '🚓', '🚑', '🚒', '🏎️'],
            bentuk: ['⭐', '🔺', '⬛', '⬜', '🔷', '🔶', '⚪', '⚫']
        };

        // Kelompok berdasarkan warna
        const colorPools = {
            merah: ['🔴', '🍎', '🍓', '❤️', '🟥'],
            kuning: ['🟡', '🍌', '⭐', '🌟', '🟨'],
            hijau: ['🟢', '🍏', '🐸', '🥦', '🟩'],
            biru: ['🔵', '🫐', '🦋', '💙', '🟦']
        };

        let roundQuestions = [];
        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function pickPool(pools, excludeKey) {
            const keys = Object.keys(pools).filter(k => k !== excludeKey);
            const key = keys[Math.floor(Math.random() * keys.length)];
            return { key, pool: pools[key] };
        }

        function genCategoryQuestion() {
            const keys = Object.keys(categoryPools);
            const mainKey = keys[Math.floor(Math.random() * keys.length)];
            const { key: oddKey, pool: oddPool } = pickPool(categoryPools, mainKey);
            const mainItems = shuffleArray(categoryPools[mainKey]).slice(0, ITEMS_PER_ROUND - 1);
            const oddItem = oddPool[Math.floor(Math.random() * oddPool.length)];
            const items = shuffleArray([...mainItems, oddItem]);
            return { items, oddIndex: items.indexOf(oddItem), hint: 'Yang bukan dari kelompok yang sama' };
        }

        function genColorQuestion() {
            const keys = Object.keys(colorPools);
            const mainKey = keys[Math.floor(Math.random() * keys.length)];
            const { key: oddKey, pool: oddPool } = pickPool(colorPools, mainKey);
            const mainItems = shuffleArray(colorPools[mainKey]).slice(0, ITEMS_PER_ROUND - 1);
            const oddItem = oddPool[Math.floor(Math.random() * oddPool.length)];
            const items = shuffleArray([...mainItems, oddItem]);
            return { items, oddIndex: items.indexOf(oddItem), hint: 'Yang warnanya beda sendiri' };
        }

        const generators = [genCategoryQuestion, genColorQuestion];

        // Audio (Web Audio API oscillator, sama seperti games/math/tambahkali)
        let audioCtx;
        let isAudioEnabled = true;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            document.getElementById('audioToggle').textContent = isAudioEnabled ? '🔊' : '🔇';
        }

        function playSfx(type) {
            if (!isAudioEnabled) return;
            initAudioContext();

            if (type === 'finish') {
                [0, 0.2, 0.4].forEach((delay, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600 + i * 150, audioCtx.currentTime + delay);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.3);
                    osc.start(audioCtx.currentTime + delay);
                    osc.stop(audioCtx.currentTime + delay + 0.3);
                });
                return;
            }

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        function renderGameScreen() {
            const container = document.getElementById('container');
            container.innerHTML = `
                <p class="question" id="question">Yang mana yang beda sendiri?</p>
                <p class="level-info" id="levelInfo"></p>
                <div class="items-grid" id="itemsGrid"></div>
                <div class="feedback" id="feedback"></div>
                <div class="score" id="score">Skor: 0/0</div>
                <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Soal Berikutnya</button>
            `;
        }

        function startGame() {
            roundQuestions = [];
            for (let i = 0; i < ROUND_SIZE; i++) {
                const gen = generators[Math.floor(Math.random() * generators.length)];
                roundQuestions.push(gen());
            }
            currentQuestion = 0;
            score = 0;
            renderGameScreen();
            displayQuestion();
        }

        function displayQuestion() {
            const current = roundQuestions[currentQuestion];
            const grid = document.getElementById('itemsGrid');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            document.getElementById('levelInfo').textContent = `Soal ${currentQuestion + 1}/${roundQuestions.length} · ${current.hint}`;
            grid.innerHTML = '';
            feedback.innerHTML = '';
            answered = false;
            nextBtn.disabled = true;
            nextBtn.textContent = 'Soal Berikutnya';

            current.items.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'item-btn';
                btn.textContent = item;
                btn.onclick = () => checkAnswer(index, btn);
                grid.appendChild(btn);
            });

            updateScore();
        }

        function checkAnswer(selectedIndex, btn) {
            if (answered) return;
            answered = true;

            const current = roundQuestions[currentQuestion];
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');
            const items = document.querySelectorAll('.item-btn');

            items.forEach(item => { item.disabled = true; });

            if (selectedIndex === current.oddIndex) {
                feedback.textContent = '✓ Benar! Itu yang beda sendiri!';
                feedback.className = 'feedback correct';
                btn.classList.add('correct');
                score++;
                playSfx('correct');
            } else {
                feedback.textContent = '✗ Belum tepat, coba lihat lagi!';
                feedback.className = 'feedback wrong';
                btn.classList.add('wrong');
                items[current.oddIndex].classList.add('correct');
                playSfx('wrong');
            }

            nextBtn.disabled = false;
            nextBtn.textContent = currentQuestion === roundQuestions.length - 1 ? 'Selesai' : 'Soal Berikutnya';
            updateScore();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= roundQuestions.length) {
                showFinish();
            } else {
                displayQuestion();
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = `Skor: ${score}/${currentQuestion + 1}`;
        }

        function showFinish() {
            playSfx('finish');
            const container = document.getElementById('container');
            const percentage = Math.round((score / roundQuestions.length) * 100);
            container.innerHTML = `
                <h2 style="color: #9b59b6; margin-bottom: 20px;">🎉 Selesai!</h2>
                <p style="font-size: 24px; color: #2c3e50; margin: 20px 0;">Skor Akhir: <strong>${score}/${roundQuestions.length}</strong></p>
                <p style="font-size: 18px; color: #666; margin: 20px 0;">${percentage}%</p>
                <p style="font-size: 16px; color: #666;">${percentage >= 80 ? '⭐ Luar biasa!' : percentage >= 60 ? '👍 Bagus!' : '💪 Terus berlatih!'}</p>
                <div style="display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;">
                    <button class="btn-next" style="margin:0;" onclick="startGame()">🔄 Main Lagi</button>
                    <a href="../" class="btn-outline">Kembali</a>
                </div>
            `;
        }

        startGame();
    </script>
</body>
</html>
