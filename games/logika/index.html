<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logika</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 16px;
            text-align: center;
            min-height: 100vh;
        }
        .top-bar {
            display: flex;
            align-items: center;
            max-width: 560px;
            margin: 0 auto 10px auto;
        }
        .btn-back {
            background-color: #c7ceea;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #a0a8c8;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: #333;
        }
        .btn-back:active { transform: translateY(4px); box-shadow: none; }
        .btn-home {
            background-color: #ffd166;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #ccaa33;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: #333;
        }
        .btn-home:active { transform: translateY(4px); box-shadow: none; }
        h1 {
            color: #9b59b6;
            font-size: 28px;
            margin: 0;
            flex: 1;
        }
        .subtitle {
            color: #888;
            font-size: 15px;
            margin: 0 0 24px 0;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 560px;
            margin: 0 auto;
        }
        .card {
            background-color: white;
            border: 4px solid #9b59b6;
            border-radius: 20px;
            padding: 20px 16px;
            width: 160px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 6px 0 #7a3f88;
            transition: transform 0.1s, box-shadow 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .card:active { transform: translateY(6px); box-shadow: none; }
        .card img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px auto;
        }
        .card p {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }
        .card small {
            display: block;
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="btn-back" href="../../">⬅ Back</a>
        <h1>Logika</h1>
        <a class="btn-home" href="../../">Home</a>
    </div>
    <p class="subtitle">Pilih materi</p>

    <div class="grid">
        <a class="card" href="./pola-urutan/">
            <img src="https://img.icons8.com/color/96/dominoes.png" alt="Pola Urutan"
                 onerror="this.style.display='none'">
            <p>Pola & Urutan</p>
            <small>Lanjutkan polanya</small>
        </a>
        <a class="card" href="./cocokkan-pasangan/">
            <img src="https://img.icons8.com/color/96/puzzle.png" alt="Cocokkan Pasangan"
                 onerror="this.style.display='none'">
            <p>Cocokkan Pasangan</p>
            <small>Temukan pasangan yang sama</small>
        </a>
        <a class="card" href="./tebak-berikutnya/">
            <img src="https://img.icons8.com/color/96/detective.png" alt="Tebak Berikutnya"
                 onerror="this.style.display='none'">
            <p>Tebak Berikutnya</p>
            <small>Apa yang hilang?</small>
        </a>
        <a class="card" href="./labirin-kode/">
            <img src="https://img.icons8.com/color/96/robot-2.png" alt="Labirin Kode"
                 onerror="this.style.display='none'">
            <p>Labirin Kode</p>
            <small>Susun perintah, bawa robot ke tujuan</small>
        </a>
    </div>
</body>
</html>
