<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tebak Berikutnya</title>
    <link rel="stylesheet" href="../../../assets/shared.css">
    <style>
        .container { max-width: 600px; }
        .question {
            font-size: 18px;
            color: #2c3e50;
            margin: 0 0 24px 0;
            font-weight: bold;
        }
        .puzzle-display {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin: 24px 0;
            flex-wrap: wrap;
        }
        .puzzle-item {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            border: 3px solid #9b59b6;
            background: white;
        }
        .puzzle-item.hidden {
            background: #ccc;
            border-style: dashed;
        }
        .hidden-text {
            font-size: 20px;
            color: #666;
        }
        .separator {
            font-size: 20px;
            color: #999;
            font-weight: bold;
        }
        .options {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 24px 0;
        }
        .option-btn {
            width: 70px;
            height: 70px;
            border: 3px solid #9b59b6;
            border-radius: 12px;
            background: white;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #7a3f88;
        }
        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #7a3f88;
        }
        .option-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .option-btn.correct {
            background: #4caf50;
            border-color: #4caf50;
            color: white;
            animation: pulse 0.6s;
        }
        .option-btn.wrong {
            background: #f44336;
            border-color: #f44336;
            color: white;
            animation: shake 0.6s;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body data-theme="logika">
    <div id="topbar"></div>
    <script src="../../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'Tebak Berikutnya', backHref: '../', homeHref: '../../../', audio: true });
    </script>

    <div class="container">
        <p class="question" id="question">Apa yang hilang?</p>

        <div class="puzzle-display" id="puzzleDisplay"></div>

        <div class="options" id="optionsContainer"></div>

        <div class="feedback" id="feedback"></div>
        <div class="score" id="score">Skor: 0/0</div>

        <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Soal Berikutnya</button>
    </div>

    <script>
        // Setiap soal punya logika yang bisa ditelusuri anak:
        // - pola berulang AB-AB (posisi genap/ganjil)
        // - deret hitung (loncat tetap)
        // - "yang belum pernah muncul" (2 opsi sudah ada di deret, 1 opsi baru = jawaban)
        const puzzleBank = [
            { items: ['🔴', '🔵', '?', '🔵'], hiddenIndex: 2, answer: '🔴', options: ['🔴', '🔵', '🟢'] },
            { items: ['⭐', '?', '⭐', '🌙'], hiddenIndex: 1, answer: '🌙', options: ['🌙', '⭐', '☀️'] },
            { items: ['1', '2', '1', '?'], hiddenIndex: 3, answer: '2', options: ['2', '1', '3'] },
            { items: ['?', '🟦', '🟩', '🟦'], hiddenIndex: 0, answer: '🟩', options: ['🟩', '🟦', '🟨'] },
            { items: ['🐰', '🐻', '?', '🐻'], hiddenIndex: 2, answer: '🐰', options: ['🐰', '🐻', '🐼'] },
            { items: ['1', '?', '3', '4'], hiddenIndex: 1, answer: '2', options: ['2', '5', '6'] },
            { items: ['?', '2', '3', '4'], hiddenIndex: 0, answer: '1', options: ['1', '5', '0'] },
            { items: ['5', '10', '?', '20'], hiddenIndex: 2, answer: '15', options: ['15', '12', '18'] },
            { items: ['2', '4', '6', '?'], hiddenIndex: 3, answer: '8', options: ['8', '7', '10'] },
            { items: ['10', '?', '30', '40'], hiddenIndex: 1, answer: '20', options: ['20', '25', '15'] },
            { items: ['3', '6', '9', '?'], hiddenIndex: 3, answer: '12', options: ['12', '10', '15'] },
            { items: ['20', '?', '40', '50'], hiddenIndex: 1, answer: '30', options: ['30', '35', '25'] },
            { items: ['🔴', '🔵', '?', '🟡'], hiddenIndex: 2, answer: '🟢', options: ['🟢', '🔴', '🔵'] },
            { items: ['🐶', '🐱', '🐰', '?'], hiddenIndex: 3, answer: '🐻', options: ['🐻', '🐶', '🐱'] },
            { items: ['🍎', '🍌', '?', '🍇'], hiddenIndex: 2, answer: '🍊', options: ['🍊', '🍎', '🍌'] },
            { items: ['🔺', '🔵', '🟩', '?'], hiddenIndex: 3, answer: '🟨', options: ['🟨', '🔺', '🔵'] }
        ];

        // Kumpulan simbol untuk generator puzzle acak (procedural),
        // supaya variasi soal jauh lebih luas daripada bank statis di atas.
        const emojiPools = [
            ['🐶', '🐱', '🐰', '🐻', '🐼', '🐨'],
            ['🍎', '🍌', '🍇', '🍊', '🍓', '🍉'],
            ['🔴', '🔵', '🟢', '🟡', '🟣', '🟠'],
            ['🔺', '🔵', '🟩', '🟨', '⬛', '⬜'],
            ['⭐', '🌙', '☀️', '🌧️', '⛄', '🌈']
        ];

        function pickWrong(pool, exclude, count) {
            return shuffleArray(pool.filter(v => !exclude.includes(v))).slice(0, count);
        }

        // Yang belum pernah muncul: 3 simbol ditampilkan, 1 simbol baru = jawaban,
        // 2 opsi salah memakai simbol yang sudah tampil (jadi bisa dieliminasi).
        function genEliminationPuzzle() {
            const pool = shuffleArray(emojiPools[Math.floor(Math.random() * emojiPools.length)]);
            const shown = pool.slice(0, 3);
            const answer = pool[3];
            const hiddenIndex = Math.floor(Math.random() * 4);
            const items = [];
            let s = 0;
            for (let i = 0; i < 4; i++) {
                items.push(i === hiddenIndex ? '?' : shown[s++]);
            }
            const distractors = shuffleArray(shown).slice(0, 2);
            return { items, hiddenIndex, answer, options: [answer, ...distractors] };
        }

        // Pola berulang AB-AB dengan posisi tersembunyi acak
        function genCycleMiddlePuzzle() {
            const pool = shuffleArray(emojiPools[Math.floor(Math.random() * emojiPools.length)]);
            const [a, b] = pool.slice(0, 2);
            const seq = [a, b, a, b];
            const hiddenIndex = Math.floor(Math.random() * 4);
            const answer = seq[hiddenIndex];
            const items = [...seq];
            items[hiddenIndex] = '?';
            const other = answer === a ? b : a;
            const fresh = pickWrong(pool, [a, b], 2);
            const distractors = [other, ...fresh].slice(0, 2);
            return { items, hiddenIndex, answer, options: [answer, ...distractors] };
        }

        // Deret hitung dengan posisi tersembunyi acak
        function genArithmeticMiddlePuzzle() {
            const stepPool = [1, 2, 3, 5, 10];
            const step = stepPool[Math.floor(Math.random() * stepPool.length)];
            const start = Math.floor(Math.random() * 20) + 1;
            const seq = [];
            for (let i = 0; i < 4; i++) seq.push(start + i * step);
            const hiddenIndex = Math.floor(Math.random() * 4);
            const answerNum = seq[hiddenIndex];
            const items = seq.map(String);
            items[hiddenIndex] = '?';
            const wrongCandidates = [answerNum + step, answerNum - step, answerNum + 1, answerNum - 1, answerNum + step * 2]
                .filter(n => n >= 0 && n !== answerNum);
            const distractors = [];
            for (const c of shuffleArray(wrongCandidates)) {
                if (distractors.length >= 2) break;
                if (!distractors.includes(c)) distractors.push(c);
            }
            while (distractors.length < 2) {
                const c = answerNum + Math.floor(Math.random() * 6) + 2;
                if (c !== answerNum && !distractors.includes(c)) distractors.push(c);
            }
            return { items, hiddenIndex, answer: String(answerNum), options: [String(answerNum), ...distractors.map(String)] };
        }

        const generators = [genEliminationPuzzle, genCycleMiddlePuzzle, genArithmeticMiddlePuzzle];
        const CURATED_COUNT = 3;
        const PROCEDURAL_COUNT = 5;

        let roundQuestions = [];
        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function renderGameScreen() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <p class="question" id="question">Apa yang hilang?</p>
                <div class="puzzle-display" id="puzzleDisplay"></div>
                <div class="options" id="optionsContainer"></div>
                <div class="feedback" id="feedback"></div>
                <div class="score" id="score">Skor: 0/0</div>
                <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Soal Berikutnya</button>
            `;
        }

        function startGame() {
            const curated = shuffleArray(puzzleBank).slice(0, CURATED_COUNT);
            const procedural = [];
            for (let i = 0; i < PROCEDURAL_COUNT; i++) {
                const gen = generators[Math.floor(Math.random() * generators.length)];
                procedural.push(gen());
            }
            roundQuestions = shuffleArray([...curated, ...procedural]).map(q => {
                const options = shuffleArray(q.options);
                return { items: q.items, hiddenIndex: q.hiddenIndex, options, correct: options.indexOf(q.answer) };
            });
            currentQuestion = 0;
            score = 0;
            renderGameScreen();
            displayQuestion();
        }

        function displayQuestion() {
            const current = roundQuestions[currentQuestion];
            const puzzleDisplay = document.getElementById('puzzleDisplay');
            const optionsContainer = document.getElementById('optionsContainer');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            puzzleDisplay.innerHTML = '';
            optionsContainer.innerHTML = '';
            feedback.innerHTML = '';
            answered = false;
            nextBtn.disabled = true;
            nextBtn.textContent = 'Soal Berikutnya';

            current.items.forEach((item, index) => {
                if (index === current.hiddenIndex) {
                    puzzleDisplay.innerHTML += `<div class="puzzle-item hidden"><span class="hidden-text">?</span></div>`;
                } else {
                    puzzleDisplay.innerHTML += `<div class="puzzle-item">${item}</div>`;
                }
                if (index < current.items.length - 1) {
                    puzzleDisplay.innerHTML += `<div class="separator">→</div>`;
                }
            });

            current.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            updateScore();
        }

        function checkAnswer(selectedIndex, btn) {
            if (answered) return;
            answered = true;

            const current = roundQuestions[currentQuestion];
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');
            const options = document.querySelectorAll('.option-btn');

            options.forEach((option) => {
                option.disabled = true;
            });

            if (selectedIndex === current.correct) {
                feedback.textContent = '✓ Benar! Jitu!';
                feedback.className = 'feedback correct';
                btn.classList.add('correct');
                score++;
                playSfx('correct');
            } else {
                feedback.textContent = '✗ Salah, coba lagi nanti!';
                feedback.className = 'feedback wrong';
                btn.classList.add('wrong');
                options[current.correct].classList.add('correct');
                playSfx('wrong');
            }

            nextBtn.disabled = false;
            nextBtn.textContent = currentQuestion === roundQuestions.length - 1 ? 'Selesai' : 'Soal Berikutnya';
            updateScore();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= roundQuestions.length) {
                showFinish();
            } else {
                displayQuestion();
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = `Skor: ${score}/${currentQuestion + 1}`;
        }

        function showFinish() {
            playSfx('finish');
            const container = document.querySelector('.container');
            const percentage = Math.round((score / roundQuestions.length) * 100);
            container.innerHTML = `
                <h2 style="color: #9b59b6; margin-bottom: 20px;">🎉 Selesai!</h2>
                <p style="font-size: 24px; color: #2c3e50; margin: 20px 0;">Skor Akhir: <strong>${score}/${roundQuestions.length}</strong></p>
                <p style="font-size: 18px; color: #666; margin: 20px 0;">${percentage}%</p>
                <p style="font-size: 16px; color: #666;">${percentage >= 80 ? '⭐ Luar biasa!' : percentage >= 60 ? '👍 Bagus!' : '💪 Terus berlatih!'}</p>
                <div style="display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;">
                    <button class="btn-next" style="margin:0;" onclick="startGame()">🔄 Main Lagi</button>
                    <a href="../" class="btn-outline">Kembali</a>
                </div>
            `;
        }

        startGame();
    </script>
</body>
</html>
