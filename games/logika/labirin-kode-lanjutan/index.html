<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Labirin Kode Lanjutan</title>
    <link rel="stylesheet" href="../../../assets/shared.css">
    <style>
        .container { max-width: 460px; }
        .question {
            font-size: 17px;
            color: #2c3e50;
            margin: 0 0 4px 0;
            font-weight: bold;
        }
        .level-info {
            font-size: 13px;
            color: #999;
            margin: 0 0 4px 0;
        }
        .hint {
            font-size: 12px;
            color: #ff9800;
            margin: 0 0 16px 0;
            font-weight: bold;
        }
        .board {
            display: grid;
            gap: 5px;
            max-width: 320px;
            margin: 0 auto 20px auto;
        }
        .cell {
            aspect-ratio: 1;
            border-radius: 8px;
            background: #f2eefb;
            border: 2px solid #ddd6ee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: background 0.2s;
        }
        .cell.wall {
            background: #55536b;
            border-color: #403e50;
        }
        .cell.robot {
            background: #fff3cd;
            border-color: #ff9800;
            animation: hop 0.25s;
        }
        @keyframes hop {
            0% { transform: scale(0.85); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .program-row:empty::before {
            content: 'Ketuk panah di bawah untuk menyusun program';
            color: #aaa;
            font-size: 13px;
            align-self: center;
        }
        .chip.repeat {
            border-color: #ff9800;
            background: #fff8ec;
        }
        .cmd-pad {
            display: grid;
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(2, 56px);
            gap: 8px;
            justify-content: center;
            margin: 0 auto 16px auto;
        }
        .cmd-btn {
            border: 3px solid var(--accent);
            border-radius: 12px;
            background: white;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--accent-shadow);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .cmd-btn:active { transform: translateY(4px); box-shadow: none; }
        .cmd-btn:disabled {
            background-color: #eee;
            cursor: not-allowed;
            box-shadow: 0 4px 0 #ccc;
            opacity: 0.6;
        }
        .cmd-repeat {
            grid-column: 1;
            grid-row: 1;
            border-color: #ff9800;
            box-shadow: 0 4px 0 #cc7a00;
            font-size: 18px;
        }
        .cmd-up { grid-column: 2; grid-row: 1; }
        .cmd-left { grid-column: 1; grid-row: 2; }
        .cmd-down { grid-column: 2; grid-row: 2; }
        .cmd-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body data-theme="logika">
    <div id="topbar"></div>
    <script src="../../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'Labirin Kode Lanjutan', backHref: '../', homeHref: '../../../', audio: true });
    </script>

    <div class="container" id="container"></div>

    <script>
        const ROUND_SIZE = 8;
        const DIRS = {
            up: { dr: -1, dc: 0, symbol: '⬆️' },
            down: { dr: 1, dc: 0, symbol: '⬇️' },
            left: { dr: 0, dc: -1, symbol: '⬅️' },
            right: { dr: 0, dc: 1, symbol: '➡️' }
        };

        let roundMazes = [];
        let currentQuestion = 0;
        let score = 0;
        let maze = null;
        let program = []; // setiap item: 'up'|'down'|'left'|'right'|'repeat'
        let robotPos = { r: 0, c: 0 };
        let solved = false;
        let running = false;
        let questionScored = false;

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // --- Pembuatan labirin (procedural, selalu dijamin bisa diselesaikan) ---
        function isSolvable(size, walls, start, goal) {
            const visited = new Set([`${start.r},${start.c}`]);
            const queue = [start];
            while (queue.length) {
                const cur = queue.shift();
                if (cur.r === goal.r && cur.c === goal.c) return true;
                const neighbors = [
                    { r: cur.r - 1, c: cur.c }, { r: cur.r + 1, c: cur.c },
                    { r: cur.r, c: cur.c - 1 }, { r: cur.r, c: cur.c + 1 }
                ];
                for (const n of neighbors) {
                    if (n.r < 0 || n.r >= size || n.c < 0 || n.c >= size) continue;
                    const key = `${n.r},${n.c}`;
                    if (visited.has(key) || walls.has(key)) continue;
                    visited.add(key);
                    queue.push(n);
                }
            }
            return false;
        }

        function generateMaze(size, wallCount) {
            const start = { r: 0, c: 0 };
            const minDistance = Math.max(3, size);

            for (let attempt = 0; attempt < 400; attempt++) {
                let goal;
                do {
                    goal = { r: Math.floor(Math.random() * size), c: Math.floor(Math.random() * size) };
                } while (Math.abs(goal.r - start.r) + Math.abs(goal.c - start.c) < minDistance);

                const walls = new Set();
                let tries = 0;
                while (walls.size < wallCount && tries < 150) {
                    tries++;
                    const r = Math.floor(Math.random() * size);
                    const c = Math.floor(Math.random() * size);
                    if ((r === start.r && c === start.c) || (r === goal.r && c === goal.c)) continue;
                    walls.add(`${r},${c}`);
                }

                if (isSolvable(size, walls, start, goal)) {
                    return { size, walls, start, goal };
                }
            }
            // fallback yang selalu aman: tanpa rintangan
            return { size, walls: new Set(), start, goal: { r: size - 1, c: size - 1 } };
        }

        function mazeParamsForIndex(i) {
            if (i < 3) return { size: 5, wallCount: 4, label: 'Mudah' };
            if (i < 6) return { size: 6, wallCount: 7, label: 'Sedang' };
            return { size: 6, wallCount: 10, label: 'Mahir' };
        }

        // --- Render & alur game ---
        function renderGameScreen() {
            const container = document.getElementById('container');
            container.innerHTML = `
                <p class="question" id="question">Bawa 🤖 ke 🏁!</p>
                <p class="level-info" id="levelInfo"></p>
                <p class="hint">🔁 = ulangi langkah terakhir, hemat perintah!</p>
                <div class="board" id="board"></div>
                <div class="program-row" id="programRow"></div>
                <div class="cmd-pad">
                    <button class="cmd-btn cmd-repeat" id="btnRepeat" onclick="addCommand('repeat')">🔁</button>
                    <button class="cmd-btn cmd-up" id="btnUp" onclick="addCommand('up')">⬆️</button>
                    <button class="cmd-btn cmd-left" id="btnLeft" onclick="addCommand('left')">⬅️</button>
                    <button class="cmd-btn cmd-down" id="btnDown" onclick="addCommand('down')">⬇️</button>
                    <button class="cmd-btn cmd-right" id="btnRight" onclick="addCommand('right')">➡️</button>
                </div>
                <div class="controls-row">
                    <button class="btn-action btn-secondary" id="btnUndo" onclick="removeLastCommand()">↩️ Hapus Terakhir</button>
                    <button class="btn-action btn-secondary" id="btnClear" onclick="clearProgram()">🗑️ Ulang</button>
                </div>
                <div class="controls-row">
                    <button class="btn-action btn-run" id="btnRun" onclick="runProgram()">▶️ Jalankan</button>
                </div>
                <div class="feedback" id="feedback"></div>
                <div class="score" id="score">Skor: 0/0</div>
                <div class="controls-row" id="resultActions" style="display:none;">
                    <button class="btn-action btn-secondary" id="retryBtn" onclick="retryQuestion()">🔁 Ulangi Lagi</button>
                    <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Soal Berikutnya</button>
                </div>
            `;
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.style.gridTemplateColumns = `repeat(${maze.size}, 1fr)`;
            boardEl.innerHTML = '';
            for (let r = 0; r < maze.size; r++) {
                for (let c = 0; c < maze.size; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (maze.walls.has(`${r},${c}`)) cell.classList.add('wall');
                    if (robotPos.r === r && robotPos.c === c) {
                        cell.textContent = '🤖';
                        cell.classList.add('robot');
                    } else if (maze.goal.r === r && maze.goal.c === c) {
                        cell.textContent = '🏁';
                    }
                    boardEl.appendChild(cell);
                }
            }
        }

        function resolvedDirAt(index) {
            // Ubah 'repeat' jadi arah nyata terakhir sebelum index tsb.
            for (let i = index; i >= 0; i--) {
                if (program[i] !== 'repeat') return program[i];
            }
            return null;
        }

        function renderProgramRow() {
            const row = document.getElementById('programRow');
            row.innerHTML = '';
            program.forEach((step, index) => {
                const chip = document.createElement('div');
                const isRepeat = step === 'repeat';
                chip.className = 'chip' + (isRepeat ? ' repeat' : '');
                chip.textContent = isRepeat ? '🔁' : DIRS[step].symbol;
                chip.dataset.index = index;
                chip.onclick = () => removeCommandAt(index);
                row.appendChild(chip);
            });
            // Refresh status tombol Repeat setiap kali isi program berubah (bukan cuma
            // saat setControlsEnabled dipanggil), tapi jangan timpa saat sedang berjalan/selesai.
            if (!running && !solved) {
                const repeatBtn = document.getElementById('btnRepeat');
                if (repeatBtn) repeatBtn.disabled = program.length === 0;
            }
        }

        function setChipState(index, state) {
            const chip = document.querySelector(`#programRow .chip[data-index="${index}"]`);
            if (!chip) return;
            chip.classList.remove('active', 'done', 'error');
            if (state) chip.classList.add(state);
        }

        function clearChipStates() {
            document.querySelectorAll('#programRow .chip').forEach(chip => {
                chip.classList.remove('active', 'done', 'error');
            });
        }

        function setControlsEnabled(enabled) {
            ['btnUp', 'btnLeft', 'btnDown', 'btnRight', 'btnUndo', 'btnClear', 'btnRun'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.disabled = !enabled;
            });
            // Tombol Repeat butuh minimal 1 langkah nyata untuk diulang — nonaktifkan
            // (bukan cuma diam-diam menolak tap) saat program masih kosong.
            const repeatBtn = document.getElementById('btnRepeat');
            if (repeatBtn) repeatBtn.disabled = !enabled || program.length === 0;
        }

        function addCommand(dir) {
            if (running || solved) return;
            if (dir === 'repeat' && program.length === 0) return;
            program.push(dir);
            renderProgramRow();
        }

        function removeLastCommand() {
            if (running || solved) return;
            program.pop();
            renderProgramRow();
        }

        function removeCommandAt(index) {
            if (running || solved) return;
            program.splice(index, 1);
            renderProgramRow();
        }

        function clearProgram() {
            if (running || solved) return;
            program = [];
            renderProgramRow();
            document.getElementById('feedback').textContent = '';
        }

        async function runProgram() {
            if (running || solved || program.length === 0) return;
            running = true;
            setControlsEnabled(false);
            document.getElementById('feedback').textContent = '';
            clearChipStates();

            let pos = { ...maze.start };
            robotPos = pos;
            renderBoard();

            let crashed = false;
            let crashIndex = -1;
            for (let i = 0; i < program.length; i++) {
                const dir = resolvedDirAt(i);
                setChipState(i, 'active');
                await sleep(380);
                const delta = DIRS[dir];
                const next = { r: pos.r + delta.dr, c: pos.c + delta.dc };
                const outOfBounds = next.r < 0 || next.r >= maze.size || next.c < 0 || next.c >= maze.size;
                const hitWall = !outOfBounds && maze.walls.has(`${next.r},${next.c}`);
                if (outOfBounds || hitWall) {
                    crashed = true;
                    crashIndex = i;
                    setChipState(i, 'error');
                    playSfx('wrong');
                    break;
                }
                pos = next;
                robotPos = pos;
                renderBoard();
                setChipState(i, 'done');
                playSfx('tick');
            }

            const reachedGoal = !crashed && pos.r === maze.goal.r && pos.c === maze.goal.c;
            const feedback = document.getElementById('feedback');

            if (reachedGoal) {
                feedback.textContent = `🎉 Sampai tujuan! Berhasil dalam ${program.length} langkah.`;
                feedback.className = 'feedback correct';
                solved = true;
                running = false; // animasi selesai — tanpa ini, tombol "Ulangi Lagi" terkunci selamanya
                if (!questionScored) {
                    questionScored = true;
                    score++;
                    updateScore();
                }
                playSfx('correct');
                document.getElementById('resultActions').style.display = 'flex';
                const nextBtn = document.getElementById('nextBtn');
                nextBtn.disabled = false;
                nextBtn.textContent = currentQuestion === roundMazes.length - 1 ? 'Selesai' : 'Soal Berikutnya';
                setControlsEnabled(false);
            } else {
                feedback.textContent = crashed
                    ? `💥 Nabrak di langkah ke-${crashIndex + 1}! Ubah panah merah itu, lalu coba lagi.`
                    : '🤔 Program selesai tapi belum sampai. Tambah langkahnya!';
                feedback.className = 'feedback wrong';
                running = false;
                setControlsEnabled(true);
                await sleep(700);
                robotPos = { ...maze.start };
                renderBoard();
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = `Skor: ${score}/${currentQuestion + 1}`;
        }

        function retryQuestion() {
            if (running) return;
            program = [];
            robotPos = { ...maze.start };
            solved = false;
            running = false;
            renderBoard();
            renderProgramRow();
            document.getElementById('feedback').textContent = '';
            document.getElementById('resultActions').style.display = 'none';
            setControlsEnabled(true);
        }

        function startGame() {
            roundMazes = [];
            for (let i = 0; i < ROUND_SIZE; i++) {
                const params = mazeParamsForIndex(i);
                roundMazes.push({ ...generateMaze(params.size, params.wallCount), label: params.label });
            }
            currentQuestion = 0;
            score = 0;
            renderGameScreen();
            loadQuestion();
        }

        function loadQuestion() {
            maze = roundMazes[currentQuestion];
            program = [];
            robotPos = { ...maze.start };
            solved = false;
            running = false;
            questionScored = false;

            renderBoard();
            renderProgramRow();
            document.getElementById('feedback').textContent = '';
            document.getElementById('levelInfo').textContent =
                `Level ${currentQuestion + 1}/${roundMazes.length} · ${maze.label} · Kotak ${maze.size}x${maze.size}${maze.walls.size ? ` · ${maze.walls.size} rintangan` : ''}`;
            setControlsEnabled(true);
            document.getElementById('resultActions').style.display = 'none';
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('nextBtn').textContent = 'Soal Berikutnya';
            updateScore();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= roundMazes.length) {
                showFinish();
            } else {
                loadQuestion();
            }
        }

        function showFinish() {
            playSfx('finish');
            const container = document.getElementById('container');
            const percentage = Math.round((score / roundMazes.length) * 100);
            container.innerHTML = `
                <h2 style="color: var(--accent); margin-bottom: 20px;">🎉 Selesai!</h2>
                <p style="font-size: 24px; color: #2c3e50; margin: 20px 0;">Skor Akhir: <strong>${score}/${roundMazes.length}</strong></p>
                <p style="font-size: 18px; color: #666; margin: 20px 0;">${percentage}%</p>
                <p style="font-size: 16px; color: #666;">${percentage >= 80 ? '⭐ Luar biasa!' : percentage >= 60 ? '👍 Bagus!' : '💪 Terus berlatih!'}</p>
                <div style="display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;">
                    <button class="btn-next" style="margin:0;" onclick="startGame()">🔄 Main Lagi</button>
                    <a href="../" class="btn-outline">Kembali</a>
                </div>
            `;
        }

        startGame();
    </script>
</body>
</html>
