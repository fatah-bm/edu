<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pipa Air</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../../../assets/shared.css">
    <style>
        .container { max-width: 560px; }
        .level-info {
            font-size: 13px;
            color: #999;
            margin: 0 0 4px 0;
        }
        .goal {
            font-size: 17px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0 0 4px 0;
        }
        .hint {
            font-size: 12px;
            color: #ff9800;
            font-weight: bold;
            margin: 4px 0 16px 0;
        }

        /* ── Papan pipa ── */
        .circuit-board {
            background: #eef5fb;
            border-radius: 16px;
            padding: 10px 4px;
            margin: 0 0 18px 0;
            overflow-x: auto;
        }
        .circuit-svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
        .wire { stroke: #b8c9e0; stroke-width: 6; fill: none; stroke-linecap: round; }
        .wire.live { stroke: #29b6f6; filter: drop-shadow(0 0 3px #4fc3f7); }
        .junction-dot { fill: #b8c9e0; }
        .junction-dot.live { fill: #29b6f6; }
        .circuit-end-text {
            font-size: 30px;
            text-anchor: middle;
            dominant-baseline: central;
            transition: filter 0.2s, opacity 0.2s;
        }
        .circuit-end-text.dim { filter: grayscale(1) brightness(0.75); opacity: 0.5; }
        .bucket-num {
            font-size: 13px;
            font-weight: bold;
            fill: #6b7c93;
            text-anchor: middle;
        }

        /* ── Gerbang/pintu air ── */
        .switch-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 4px;
            border-radius: 10px;
            border: 3px solid #ccc;
            background: white;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 3px 0 #bbb;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .switch-chip:active { transform: translateY(3px); box-shadow: none; }
        .switch-icon { font-size: 20px; line-height: 1; }
        .switch-state {
            font-size: 10px;
            font-weight: bold;
            color: #999;
            line-height: 1;
        }
        .switch-chip.on {
            border-color: #2ecc71;
            background: #eafaf1;
            box-shadow: 0 3px 0 #27ae60;
        }
        .switch-chip.on .switch-state { color: #27ae60; }
        .switch-chip.inverted { border-style: dashed; }
        .switch-chip.inverted:not(.on) { border-color: #ff9800; }
        .switch-chip.inverted:not(.on) .switch-state { color: #cc7a00; }

        .btn-check {
            width: 100%;
            padding: 14px;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            background: var(--accent);
            color: white;
            box-shadow: 0 5px 0 var(--accent-shadow);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 10px;
        }
        .btn-check:active { transform: translateY(5px); box-shadow: none; }
    </style>
</head>
<body data-theme="logika">
    <div id="topbar"></div>
    <script src="../../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'Pipa Air', backHref: '../', homeHref: '../../../', audio: true });
    </script>

    <div class="container" id="container"></div>

    <script>
        const UNIT_W = 110; // lebar SVG per "level" seri
        const LANE_H = 64;  // tinggi SVG per jalur paralel/cabang ember
        const MARGIN_X = 34;

        function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

        // Soal 1-4: satu pohon, satu ember. Kesulitan naik lewat n (jumlah gerbang) &
        // depth (kedalaman campuran seri/paralel) — sampai 4 level kedalaman di soal
        // tersulit (dibuktikan tetap solvable oleh assignForTarget untuk depth berapa pun).
        const SINGLE_LEVELS = [
            { n: 1, depth: 0, invert: 0 },
            { n: 2, depth: 1, invert: 0 },
            { n: 3, depth: 2, invert: 1 },
            { n: 5, depth: 4, invert: 1 }
        ];

        // Soal 5-8: satu akar (gerbang bersama opsional) bercabang ke beberapa daun/ember.
        // Tiap field [min, max] diacak ULANG setiap sesi (jumlah cabang, jumlah gerbang
        // bersama, kedalaman tiap cabang) — supaya struktur soal berbeda tiap kali main,
        // bukan susunan gerbang yang itu-itu saja.
        const MULTI_LEVELS = [
            { sharedN: [0, 0], sharedDepth: [0, 0], branchCount: [2, 2], branchN: [1, 1], branchDepth: [0, 0], branchInvert: [0, 0] },
            { sharedN: [1, 1], sharedDepth: [0, 0], branchCount: [2, 2], branchN: [1, 2], branchDepth: [0, 1], branchInvert: [0, 1] },
            { sharedN: [1, 2], sharedDepth: [1, 1], branchCount: [2, 3], branchN: [1, 2], branchDepth: [0, 1], branchInvert: [0, 1] },
            { sharedN: [2, 3], sharedDepth: [1, 2], branchCount: [2, 3], branchN: [2, 3], branchDepth: [1, 3], branchInvert: [0, 2] }
        ];

        let roundLevels = [];
        let currentQuestion = 0;
        let score = 0;
        let level = null;
        let switchState = {};
        let answered = false;
        let questionScored = false;

        // --- Pembuatan topologi acak (seri & paralel bisa bergabung berulang) ---
        function makeLeaf(invertBudget, nextId) {
            const inverted = invertBudget.count > 0 && Math.random() < 0.5;
            if (inverted) invertBudget.count--;
            return { type: 'switch', id: nextId.next++, inverted };
        }

        function randomTopology(n, depth, invertBudget, nextId) {
            if (n <= 1) return makeLeaf(invertBudget, nextId);
            if (depth <= 0) {
                // Kehabisan jatah kedalaman — gabungkan sisa gerbang jadi satu kelompok datar
                const type = Math.random() < 0.5 ? 'series' : 'parallel';
                const children = Array.from({ length: n }, () => makeLeaf(invertBudget, nextId));
                return { type, children };
            }
            const type = Math.random() < 0.5 ? 'series' : 'parallel';
            const leftN = 1 + Math.floor(Math.random() * (n - 1));
            const rightN = n - leftN;
            return {
                type,
                children: [
                    randomTopology(leftN, depth - 1, invertBudget, nextId),
                    randomTopology(rightN, depth - 1, invertBudget, nextId)
                ]
            };
        }

        function collectSwitches(node, out) {
            out = out || [];
            if (node.type === 'switch') out.push(node);
            else node.children.forEach(c => collectSwitches(c, out));
            return out;
        }

        function containsType(node, type) {
            if (node.type === 'switch') return false;
            if (node.type === type) return true;
            return node.children.some(c => containsType(c, type));
        }

        function describeTopology(node, switchCount, hasInverted) {
            let base;
            if (switchCount === 1) base = 'Satu gerbang';
            else if (containsType(node, 'series') && containsType(node, 'parallel')) base = `${switchCount} gerbang campuran`;
            else if (containsType(node, 'parallel')) base = `${switchCount} gerbang bercabang`;
            else base = `${switchCount} gerbang berurutan`;
            return hasInverted ? base + ' (ada yang terbalik)' : base;
        }

        // Isi `out` dengan status gerbang yang menjamin evalNode(node, out) === target,
        // dengan sedikit acak (gerbang mana yang "menentukan" & nilai gerbang lain yang
        // tidak berpengaruh) supaya kondisi awal tidak selalu berpola sama.
        function assignForTarget(node, target, out) {
            if (node.type === 'switch') {
                out[node.id] = node.inverted ? !target : target;
                return;
            }
            const kids = node.children;
            const isSeries = node.type === 'series';
            const allSame = (isSeries && target) || (!isSeries && !target);
            if (allSame) {
                kids.forEach(k => assignForTarget(k, target, out));
            } else {
                const forcedIndex = Math.floor(Math.random() * kids.length);
                kids.forEach((k, i) => {
                    if (i === forcedIndex) assignForTarget(k, target, out);
                    else assignForTarget(k, Math.random() < 0.5, out);
                });
            }
        }

        function buildBranch(bcfg, nextId) {
            const invertBudget = { count: bcfg.invert };
            const topology = randomTopology(bcfg.n, bcfg.depth, invertBudget, nextId);
            const switches = collectSwitches(topology);
            const hasInverted = switches.some(s => s.inverted);
            return {
                topology, switches, hasInverted, goal: Math.random() < 0.5,
                label: describeTopology(topology, switches.length, hasInverted)
            };
        }

        function generateLevel(index) {
            const nextId = { next: 0 };
            const initState = {};

            if (index < SINGLE_LEVELS.length) {
                // Satu ember biasa — satu pohon, satu tujuan.
                const branch = buildBranch(SINGLE_LEVELS[index], nextId);
                assignForTarget(branch.topology, !branch.goal, initState);
                return {
                    shared: null, branches: [branch],
                    hasInverted: branch.hasInverted, label: branch.label, initState
                };
            }

            // Banyak ember — satu akar (gerbang bersama, opsional) bercabang ke beberapa daun.
            // Jumlah cabang, jumlah gerbang bersama, dan bentuk tiap cabang diacak dari
            // rentang [min,max] di MULTI_LEVELS setiap kali soal ini dibuat.
            const cfg = MULTI_LEVELS[index - SINGLE_LEVELS.length];
            const sharedN = randInt(cfg.sharedN[0], cfg.sharedN[1]);
            const sharedDepth = randInt(cfg.sharedDepth[0], cfg.sharedDepth[1]);
            const branchCount = randInt(cfg.branchCount[0], cfg.branchCount[1]);
            const shared = sharedN > 0 ? randomTopology(sharedN, sharedDepth, { count: 0 }, nextId) : null;
            const branches = Array.from({ length: branchCount }, () => buildBranch({
                n: randInt(cfg.branchN[0], cfg.branchN[1]),
                depth: randInt(cfg.branchDepth[0], cfg.branchDepth[1]),
                invert: randInt(cfg.branchInvert[0], cfg.branchInvert[1])
            }, nextId));

            // Kondisi awal: paksa gerbang bersama TERBUKA (supaya tidak jadi penentu
            // tunggal yang membingungkan), lalu tiap cabang dipaksa berlawanan dari
            // tujuannya sendiri — hasilnya semua ember dijamin salah di awal sekaligus.
            if (shared) assignForTarget(shared, true, initState);
            branches.forEach(b => assignForTarget(b.topology, !b.goal, initState));

            const totalGerbang = (shared ? collectSwitches(shared).length : 0) +
                branches.reduce((s, b) => s + b.switches.length, 0);
            const hasInverted = (shared && collectSwitches(shared).some(s => s.inverted)) ||
                branches.some(b => b.hasInverted);

            return {
                shared, branches, hasInverted,
                label: `${branches.length} ember · ${totalGerbang} gerbang`,
                initState
            };
        }

        // --- Evaluasi aliran air ---
        function evalNode(node, state) {
            if (node.type === 'switch') {
                const open = !!state[node.id];
                return node.inverted ? !open : open;
            }
            if (node.type === 'series') return node.children.every(c => evalNode(c, state));
            return node.children.some(c => evalNode(c, state)); // parallel
        }

        function branchReaches(branch) {
            const sharedOk = level.shared ? evalNode(level.shared, switchState) : true;
            return sharedOk && evalNode(branch.topology, switchState);
        }

        // --- Ukur & render pohon topologi jadi diagram pipa (SVG) ---
        function measure(node) {
            if (node.type === 'switch') return { w: 1, h: 1 };
            const kids = node.children.map(measure);
            if (node.type === 'series') {
                return { w: kids.reduce((s, k) => s + k.w, 0), h: Math.max(...kids.map(k => k.h)) };
            }
            return { w: Math.max(...kids.map(k => k.w)), h: kids.reduce((s, k) => s + k.h, 0) };
        }

        function wireLine(x1, y1, x2, y2, live) {
            return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="wire${live ? ' live' : ''}" />`;
        }
        function junctionDot(cx, cy, live) {
            return `<circle cx="${cx}" cy="${cy}" r="5" class="junction-dot${live ? ' live' : ''}" />`;
        }
        function gateButton(node, cx, cy) {
            const isOpen = !!switchState[node.id];
            return `<foreignObject x="${cx - 30}" y="${cy - 27}" width="60" height="54">
                <button xmlns="http://www.w3.org/1999/xhtml" class="switch-chip${node.inverted ? ' inverted' : ''}${isOpen ? ' on' : ''}"
                        data-id="${node.id}" onclick="toggleSwitch(${node.id})">
                    <span class="switch-icon">${node.inverted ? '🔀' : '🚪'}</span>
                    <span class="switch-state">${isOpen ? 'BUKA' : 'TUTUP'}</span>
                </button>
            </foreignObject>`;
        }

        // Menggambar simpul secara rekursif SAMBIL membawa `incoming` (apakah air
        // benar-benar sampai ke pintu masuk simpul ini dari sumber). Ini penting:
        // status "mengalir" tiap kabel harus dihitung dari akumulasi hulu ke hilir,
        // bukan cuma status gerbang itu sendiri — kalau tidak, kabel bisa tampak
        // "mengalir" padahal gerbang SEBELUMNYA tertutup (bug yang pernah terjadi).
        // Mengembalikan { svg, outgoing } — outgoing dipakai simpul induk sebagai
        // incoming untuk simpul berikutnya.
        function renderNode(node, x, y, w, h, incoming) {
            const centerY = y + (h * LANE_H) / 2;
            if (node.type === 'switch') {
                const cx = x + (w * UNIT_W) / 2;
                const open = !!switchState[node.id];
                const selfConducts = node.inverted ? !open : open;
                const outgoing = incoming && selfConducts;
                const svg = wireLine(x, centerY, cx - 30, centerY, incoming) +
                    gateButton(node, cx, centerY) +
                    wireLine(cx + 30, centerY, x + w * UNIT_W, centerY, outgoing);
                return { svg, outgoing };
            }

            const kids = node.children;
            const kidMeasures = kids.map(measure);

            if (node.type === 'series') {
                let cursorX = x;
                let flow = incoming;
                let svg = '';
                kids.forEach((kid, i) => {
                    const km = kidMeasures[i];
                    const kidY = y + ((h - km.h) * LANE_H) / 2;
                    const res = renderNode(kid, cursorX, kidY, km.w, km.h, flow);
                    svg += res.svg;
                    flow = res.outgoing;
                    cursorX += km.w * UNIT_W;
                });
                return { svg, outgoing: flow };
            }

            // parallel
            const totalW = w * UNIT_W;
            let cursorY = y;
            const laneCenters = kidMeasures.map(km => {
                const c = cursorY + (km.h * LANE_H) / 2;
                cursorY += km.h * LANE_H;
                return c;
            });
            let branchesSvg = '';
            const branchOutgoings = [];
            cursorY = y;
            kids.forEach((kid, i) => {
                const km = kidMeasures[i];
                const laneY = laneCenters[i];
                const kidW = km.w * UNIT_W;
                const padLeft = (totalW - kidW) / 2;
                const res = renderNode(kid, x + padLeft, cursorY, km.w, km.h, incoming);
                branchesSvg += wireLine(x, laneY, x + padLeft, laneY, incoming) +
                    res.svg +
                    wireLine(x + padLeft + kidW, laneY, x + totalW, laneY, res.outgoing);
                branchOutgoings.push(res.outgoing);
                cursorY += km.h * LANE_H;
            });
            const anyOutgoing = branchOutgoings.some(v => v);
            const connectorsSvg = wireLine(x, laneCenters[0], x, laneCenters[laneCenters.length - 1], incoming) +
                wireLine(x + totalW, laneCenters[0], x + totalW, laneCenters[laneCenters.length - 1], anyOutgoing) +
                junctionDot(x, centerY, incoming) +
                junctionDot(x + totalW, centerY, anyOutgoing);
            return { svg: connectorsSvg + branchesSvg, outgoing: anyOutgoing };
        }

        function renderCircuitBoard() {
            const sharedM = level.shared ? measure(level.shared) : { w: 0, h: 0 };
            const branchMs = level.branches.map(b => measure(b.topology));
            const forkW = Math.max(...branchMs.map(m => m.w));
            const forkH = branchMs.reduce((s, m) => s + m.h, 0);
            const totalW = sharedM.w + forkW;
            const totalH = Math.max(sharedM.h, forkH, 1);

            const boardW = Math.max(totalW * UNIT_W, UNIT_W);
            const boardH = Math.max(totalH * LANE_H, LANE_H);
            const centerY = 10 + boardH / 2;

            let svg = wireLine(16, MARGIN_X > 0 ? centerY : centerY, MARGIN_X, centerY, true);
            let x = MARGIN_X;
            let incoming = true;

            if (level.shared) {
                const sharedY = centerY - (sharedM.h * LANE_H) / 2;
                const res = renderNode(level.shared, x, sharedY, sharedM.w, sharedM.h, true);
                svg += res.svg;
                incoming = res.outgoing;
                x += sharedM.w * UNIT_W;
            }

            const forkPxW = forkW * UNIT_W;
            // Cermin posisi ikon sumber 🚰 di sisi kiri (jarak MARGIN_X dari tepi svg)
            // supaya diagram simetris — sebelumnya sisi kanan pakai +26/+70 (nyaris 2x
            // MARGIN_X), bikin seluruh diagram terlihat "nempel" ke kiri.
            const bucketX = x + forkPxW + MARGIN_X / 2;
            const multiFork = level.branches.length > 1;
            let cursorY = 10 + (boardH - forkH * LANE_H) / 2;
            const laneCenters = branchMs.map(bm => {
                const c = cursorY + (bm.h * LANE_H) / 2;
                cursorY += bm.h * LANE_H;
                return c;
            });

            if (multiFork) {
                svg += wireLine(x, laneCenters[0], x, laneCenters[laneCenters.length - 1], incoming);
                svg += junctionDot(x, centerY, incoming);
            }

            cursorY = 10 + (boardH - forkH * LANE_H) / 2;
            level.branches.forEach((b, i) => {
                const bm = branchMs[i];
                const laneY = laneCenters[i];
                const bw = bm.w * UNIT_W;
                const padLeft = (forkPxW - bw) / 2;
                svg += wireLine(x, laneY, x + padLeft, laneY, incoming);
                const res = renderNode(b.topology, x + padLeft, cursorY, bm.w, bm.h, incoming);
                svg += res.svg;
                const exitX = x + padLeft + bw;
                svg += wireLine(exitX, laneY, bucketX - 15, laneY, res.outgoing);
                svg += `<text x="${bucketX}" y="${laneY}" class="circuit-end-text${res.outgoing ? '' : ' dim'}">🪣</text>`;
                if (multiFork) svg += `<text x="${bucketX}" y="${laneY - 24}" class="bucket-num">${i + 1}</text>`;
                cursorY += bm.h * LANE_H;
            });

            const svgW = x + forkPxW + MARGIN_X;
            const svgH = boardH + 20;

            document.getElementById('circuitBoard').innerHTML = `
                <svg class="circuit-svg" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">
                    ${svg}
                    <text x="12" y="${centerY}" class="circuit-end-text">🚰</text>
                </svg>`;
        }

        function toggleSwitch(id) {
            if (answered) return;
            switchState[id] = !switchState[id];
            renderCircuitBoard();
        }

        // --- Alur layar ---
        function renderGameScreen() {
            const container = document.getElementById('container');
            container.innerHTML = `
                <p class="level-info" id="levelInfo"></p>
                <div id="goalList"></div>
                <p class="hint" id="hint" style="display:none;">🔀 = gerbang terbalik, air lewat kalau TUTUP!</p>
                <div class="circuit-board" id="circuitBoard"></div>
                <div class="feedback" id="feedback"></div>
                <button class="btn-check" id="btnCheck" onclick="checkAnswer()">✅ Cek</button>
                <div class="score" id="score">Skor: 0/0</div>
                <button class="btn-next" id="nextBtn" onclick="nextQuestion()" disabled>Soal Berikutnya</button>
            `;
        }

        function updateScore() {
            document.getElementById('score').textContent = `Skor: ${score}/${currentQuestion + 1}`;
        }

        function loadQuestion() {
            level = roundLevels[currentQuestion];
            switchState = { ...level.initState };
            answered = false;
            questionScored = false;

            document.getElementById('levelInfo').textContent =
                `Soal ${currentQuestion + 1}/${roundLevels.length} · ${level.label}`;
            document.getElementById('goalList').innerHTML = level.branches.map((b, i) => `
                <p class="goal">${level.branches.length > 1 ? `🪣${i + 1} — ` : ''}${b.goal ? '🎯 Isi embernya!' : '🎯 Jangan sampai ember terisi!'}</p>
            `).join('');
            document.getElementById('hint').style.display = level.hasInverted ? 'block' : 'none';
            document.getElementById('feedback').textContent = '';
            document.getElementById('btnCheck').disabled = false;
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('nextBtn').textContent = 'Soal Berikutnya';
            renderCircuitBoard();
            updateScore();
        }

        function checkAnswer() {
            if (answered) return;
            const results = level.branches.map(b => branchReaches(b) === b.goal);
            const allCorrect = results.every(r => r);
            const feedback = document.getElementById('feedback');

            if (allCorrect) {
                answered = true;
                if (!questionScored) {
                    questionScored = true;
                    score++;
                    updateScore();
                }
                feedback.textContent = '🎉 Tepat sekali!';
                feedback.className = 'feedback correct';
                playSfx('correct');
                confetti({ particleCount: 60, spread: 60, origin: { y: 0.6 } });
                document.getElementById('btnCheck').disabled = true;
                const nextBtn = document.getElementById('nextBtn');
                nextBtn.disabled = false;
                nextBtn.textContent = currentQuestion === roundLevels.length - 1 ? 'Selesai' : 'Soal Berikutnya';
            } else {
                const wrongNums = results.map((ok, i) => ok ? null : i + 1).filter(n => n !== null);
                feedback.textContent = level.branches.length > 1
                    ? `🤔 Ember ${wrongNums.join(', ')} belum sesuai, coba lagi!`
                    : '🤔 Belum tepat, coba atur gerbangnya lagi!';
                feedback.className = 'feedback wrong';
                playSfx('wrong');
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= roundLevels.length) {
                showFinish();
            } else {
                loadQuestion();
            }
        }

        function startGame() {
            const total = SINGLE_LEVELS.length + MULTI_LEVELS.length;
            roundLevels = Array.from({ length: total }, (_, i) => generateLevel(i));
            currentQuestion = 0;
            score = 0;
            renderGameScreen();
            loadQuestion();
        }

        function showFinish() {
            playSfx('finish');
            const container = document.getElementById('container');
            const percentage = Math.round((score / roundLevels.length) * 100);
            container.innerHTML = `
                <h2 style="color: var(--accent); margin-bottom: 20px;">🎉 Selesai!</h2>
                <p style="font-size: 24px; color: #2c3e50; margin: 20px 0;">Skor Akhir: <strong>${score}/${roundLevels.length}</strong></p>
                <p style="font-size: 18px; color: #666; margin: 20px 0;">${percentage}%</p>
                <p style="font-size: 16px; color: #666;">${percentage >= 80 ? '⭐ Luar biasa!' : percentage >= 60 ? '👍 Bagus!' : '💪 Terus berlatih!'}</p>
                <div style="display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;">
                    <button class="btn-next" style="margin:0;" onclick="startGame()">🔄 Main Lagi</button>
                    <a href="../" class="btn-outline">Kembali</a>
                </div>
            `;
        }

        startGame();
    </script>
</body>
</html>
