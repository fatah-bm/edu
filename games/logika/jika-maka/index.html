<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logika Jika-Maka</title>
    <link rel="stylesheet" href="../../../assets/shared.css">
    <style>
        .container { max-width: 600px; }
        .level-info {
            font-size: 13px;
            color: #999;
            margin: 0 0 12px 0;
        }
        .rule-box {
            background: #f5f0fa;
            border-radius: 16px;
            padding: 20px 16px;
            margin: 0 0 24px 0;
        }
        .rule-label {
            font-size: 13px;
            color: var(--accent);
            font-weight: bold;
            margin: 0 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .rule-condition {
            font-size: 22px;
            color: #2c3e50;
            font-weight: bold;
        }
        .rule-arrow {
            font-size: 22px;
            color: #ff9800;
            margin: 10px 0;
        }
        .rule-question {
            font-size: 18px;
            color: #2c3e50;
            font-weight: bold;
            margin: 0 0 20px 0;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 0 0 24px 0;
        }
        .option-btn {
            padding: 14px 16px;
            border: 3px solid var(--accent);
            border-radius: 14px;
            background: white;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 var(--accent-shadow);
            color: #2c3e50;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--accent-shadow);
        }
        .option-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .option-btn.correct {
            background: #4caf50;
            border-color: #4caf50;
            color: white;
            animation: pulse 0.6s;
        }
        .option-btn.wrong {
            background: #f44336;
            border-color: #f44336;
            color: white;
            animation: shake 0.6s;
        }
        .option-btn:disabled { cursor: not-allowed; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
    </style>
</head>
<body data-theme="logika">
    <div id="topbar"></div>
    <script src="../../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'Jika-Maka', backHref: '../', homeHref: '../../../', audio: true });
    </script>

    <div class="container" id="container"></div>

    <script>
        const ROUND_SIZE = 8;

        // Setiap kategori berisi pasangan kondisi -> tindakan yang benar.
        // Pengecoh (distractor) diambil dari tindakan lain di kategori yang sama,
        // supaya tetap masuk akal tapi salah konteks.
        const categories = [
            {
                name: 'cuaca',
                rules: [
                    { cond: '🌧️ Hujan turun', action: '☂️ Pakai payung' },
                    { cond: '☀️ Matahari sangat terik', action: '🧢 Pakai topi' },
                    { cond: '❄️ Cuaca sangat dingin', action: '🧥 Pakai jaket tebal' },
                    { cond: '💨 Angin kencang di luar', action: '🚪 Tutup jendela' }
                ]
            },
            {
                name: 'lalu-lintas',
                rules: [
                    { cond: '🔴 Lampu merah menyala', action: '🛑 Berhenti' },
                    { cond: '🟡 Lampu kuning menyala', action: '⏳ Bersiap-siap' },
                    { cond: '🟢 Lampu hijau menyala', action: '🚶 Boleh jalan' }
                ]
            },
            {
                name: 'rutinitas',
                rules: [
                    { cond: '🌅 Baru bangun tidur', action: '🪥 Gosok gigi' },
                    { cond: '🌙 Sudah malam dan mengantuk', action: '😴 Waktunya tidur' },
                    { cond: '🍽️ Sebelum makan', action: '🧼 Cuci tangan' },
                    { cond: '📚 Waktunya berangkat sekolah', action: '🎒 Pakai tas & seragam' }
                ]
            },
            {
                name: 'perasaan',
                rules: [
                    { cond: '😢 Teman terlihat sedih', action: '🤗 Beri semangat & pelukan' },
                    { cond: '🎂 Ulang tahun temanmu', action: '🎉 Ucapkan selamat' },
                    { cond: '😡 Kamu sedang marah', action: '🧘 Tarik napas dan tenang' },
                    { cond: '🤕 Teman terluka', action: '🏥 Minta bantuan orang dewasa' }
                ]
            },
            {
                name: 'aman-sehat',
                rules: [
                    { cond: '🔥 Ada asap atau kebakaran', action: '🚪 Segera keluar & cari bantuan' },
                    { cond: '🚦 Mau menyeberang jalan', action: '👀 Lihat kanan-kiri dulu' },
                    { cond: '🩸 Kulit terluka kecil', action: '🩹 Tempel plester' },
                    { cond: '🤧 Mau bersin atau batuk', action: '🤲 Tutup mulut & hidung' }
                ]
            }
        ];

        let roundQuestions = [];
        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function buildQuestion(category, rule) {
            const sameCategoryPool = category.rules
                .filter(r => r.action !== rule.action)
                .map(r => r.action);

            let distractors = shuffleArray(sameCategoryPool).slice(0, 2);

            if (distractors.length < 2) {
                const allOtherActions = categories
                    .flatMap(c => c.rules)
                    .map(r => r.action)
                    .filter(a => a !== rule.action && !distractors.includes(a));
                distractors = distractors.concat(shuffleArray(allOtherActions).slice(0, 2 - distractors.length));
            }

            const options = shuffleArray([rule.action, ...distractors]);
            return { cond: rule.cond, correct: options.indexOf(rule.action), options };
        }

        function renderGameScreen() {
            const container = document.getElementById('container');
            container.innerHTML = `
                <p class="level-info" id="levelInfo"></p>
                <div class="rule-box">
                    <p class="rule-label">Jika...</p>
                    <p class="rule-condition" id="ruleCondition"></p>
                </div>
                <p class="rule-question">Maka apa yang sebaiknya dilakukan?</p>
                <div class="options" id="optionsContainer"></div>
                <div class="feedback" id="feedback"></div>
                <div class="score" id="score">Skor: 0/0</div>
                <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Soal Berikutnya</button>
            `;
        }

        function startGame() {
            const allRules = shuffleArray(categories.flatMap(c => c.rules.map(r => ({ category: c, rule: r }))));
            const picked = allRules.slice(0, ROUND_SIZE);
            roundQuestions = picked.map(({ category, rule }) => buildQuestion(category, rule));
            currentQuestion = 0;
            score = 0;
            renderGameScreen();
            displayQuestion();
        }

        function displayQuestion() {
            const current = roundQuestions[currentQuestion];
            const optionsContainer = document.getElementById('optionsContainer');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            document.getElementById('ruleCondition').textContent = current.cond;
            document.getElementById('levelInfo').textContent = `Soal ${currentQuestion + 1}/${roundQuestions.length}`;
            optionsContainer.innerHTML = '';
            feedback.innerHTML = '';
            answered = false;
            nextBtn.disabled = true;
            nextBtn.textContent = 'Soal Berikutnya';

            current.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            updateScore();
        }

        function checkAnswer(selectedIndex, btn) {
            if (answered) return;
            answered = true;

            const current = roundQuestions[currentQuestion];
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');
            const options = document.querySelectorAll('.option-btn');

            options.forEach(option => { option.disabled = true; });

            if (selectedIndex === current.correct) {
                feedback.textContent = '✓ Benar! Keputusan yang tepat!';
                feedback.className = 'feedback correct';
                btn.classList.add('correct');
                score++;
                playSfx('correct');
            } else {
                feedback.textContent = '✗ Belum tepat, lihat jawaban yang benar ya!';
                feedback.className = 'feedback wrong';
                btn.classList.add('wrong');
                options[current.correct].classList.add('correct');
                playSfx('wrong');
            }

            nextBtn.disabled = false;
            nextBtn.textContent = currentQuestion === roundQuestions.length - 1 ? 'Selesai' : 'Soal Berikutnya';
            updateScore();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= roundQuestions.length) {
                showFinish();
            } else {
                displayQuestion();
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = `Skor: ${score}/${currentQuestion + 1}`;
        }

        function showFinish() {
            playSfx('finish');
            const container = document.getElementById('container');
            const percentage = Math.round((score / roundQuestions.length) * 100);
            container.innerHTML = `
                <h2 style="color: var(--accent); margin-bottom: 20px;">🎉 Selesai!</h2>
                <p style="font-size: 24px; color: #2c3e50; margin: 20px 0;">Skor Akhir: <strong>${score}/${roundQuestions.length}</strong></p>
                <p style="font-size: 18px; color: #666; margin: 20px 0;">${percentage}%</p>
                <p style="font-size: 16px; color: #666;">${percentage >= 80 ? '⭐ Luar biasa!' : percentage >= 60 ? '👍 Bagus!' : '💪 Terus berlatih!'}</p>
                <div style="display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;">
                    <button class="btn-next" style="margin:0;" onclick="startGame()">🔄 Main Lagi</button>
                    <a href="../" class="btn-outline">Kembali</a>
                </div>
            `;
        }

        startGame();
    </script>
</body>
</html>
