<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cocokkan Pasangan</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #f0f8ff 0%, #e8f4f8 100%);
            margin: 0;
            padding: 16px;
            text-align: center;
            min-height: 100vh;
        }
        .top-bar {
            display: flex;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 20px auto;
            gap: 8px;
        }
        .btn-back {
            background-color: #c7ceea;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #a0a8c8;
            text-decoration: none;
            color: #333;
        }
        .btn-back:active { transform: translateY(4px); box-shadow: none; }
        .btn-audio {
            background-color: #c7ceea;
            border: none;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 0 #a0a8c8;
            line-height: 1;
        }
        .btn-audio:active { transform: translateY(4px); box-shadow: none; }
        h1 {
            color: #9b59b6;
            font-size: 28px;
            margin: 0;
            flex: 1;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .question {
            font-size: 18px;
            color: #2c3e50;
            margin: 0 0 24px 0;
            font-weight: bold;
        }
        .game-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 24px 0;
        }
        .column {
            text-align: center;
        }
        .column-title {
            font-weight: bold;
            color: #9b59b6;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .card {
            width: 100%;
            aspect-ratio: 1;
            border: 3px solid #9b59b6;
            border-radius: 12px;
            background: white;
            font-size: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #7a3f88;
            margin-bottom: 12px;
        }
        .card:hover:not(.matched) {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #7a3f88;
        }
        .card:active:not(.matched) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #7a3f88;
        }
        .card.selected {
            background: #fff3cd;
            border-color: #ff9800;
        }
        .card.matched {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
            box-shadow: none;
            cursor: default;
        }
        .score {
            font-size: 16px;
            color: #666;
            margin: 16px 0;
        }
        .feedback {
            font-size: 20px;
            margin: 16px 0;
            font-weight: bold;
            height: 30px;
        }
        .feedback.correct { color: #4caf50; }
        .feedback.wrong { color: #f44336; }
        .btn-next {
            background-color: #9b59b6;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #7a3f88;
            color: white;
            margin: 16px 0;
        }
        .btn-next:active { transform: translateY(4px); box-shadow: none; }
        .btn-outline {
            display: inline-block;
            padding: 12px 24px;
            background: white;
            color: #9b59b6;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            border: 3px solid #9b59b6;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="btn-back" href="../">⬅ Back</a>
        <h1>Cocokkan Pasangan</h1>
        <button class="btn-audio" id="audioToggle" onclick="toggleAudio()">🔊</button>
    </div>

    <div class="container">
        <p class="question">Cocokkan pasangan yang sama!</p>

        <div class="game-board">
            <div class="column">
                <div class="column-title">Pilih</div>
                <div id="leftColumn"></div>
            </div>
            <div class="column">
                <div class="column-title">Pasangan</div>
                <div id="rightColumn"></div>
            </div>
        </div>

        <div class="feedback" id="feedback"></div>
        <div class="score" id="score">Pasangan ditemukan: 0/0</div>
    </div>

    <script>
        const pairsBank = [
            { left: '🐶', right: '🦴' },
            { left: '🍎', right: '🌳' },
            { left: '☀️', right: '🌤️' },
            { left: '👕', right: '👖' },
            { left: '🏠', right: '🚪' },
            { left: '🐱', right: '🐟' },
            { left: '🔑', right: '🔒' },
            { left: '✏️', right: '📝' },
            { left: '🌂', right: '🌧️' },
            { left: '🧦', right: '👟' },
            { left: '🚗', right: '🔧' },
            { left: '🐝', right: '🍯' },
            { left: '🕯️', right: '🔥' },
            { left: '📖', right: '🔖' }
        ];

        const ROUND_PAIRS = 6;

        let pairs = [];
        let leftCards = [];
        let rightCards = [];
        let selectedLeft = null;
        let matchedCount = 0;

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // Audio (Web Audio API oscillator, sama seperti games/math/tambahkali)
        let audioCtx;
        let isAudioEnabled = true;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            document.getElementById('audioToggle').textContent = isAudioEnabled ? '🔊' : '🔇';
        }

        function playSfx(type) {
            if (!isAudioEnabled) return;
            initAudioContext();

            if (type === 'finish') {
                [0, 0.2, 0.4].forEach((delay, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600 + i * 150, audioCtx.currentTime + delay);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.3);
                    osc.start(audioCtx.currentTime + delay);
                    osc.stop(audioCtx.currentTime + delay + 0.3);
                });
                return;
            }

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        function renderGameScreen() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <p class="question">Cocokkan pasangan yang sama!</p>
                <div class="game-board">
                    <div class="column">
                        <div class="column-title">Pilih</div>
                        <div id="leftColumn"></div>
                    </div>
                    <div class="column">
                        <div class="column-title">Pasangan</div>
                        <div id="rightColumn"></div>
                    </div>
                </div>
                <div class="feedback" id="feedback"></div>
                <div class="score" id="score">Pasangan ditemukan: 0/${pairs.length}</div>
            `;
        }

        function startGame() {
            pairs = shuffleArray(pairsBank).slice(0, ROUND_PAIRS);
            leftCards = [];
            rightCards = [];
            selectedLeft = null;
            matchedCount = 0;

            renderGameScreen();

            const leftColumn = document.getElementById('leftColumn');
            const rightColumn = document.getElementById('rightColumn');

            const leftOrder = shuffleArray(pairs.map((p, i) => ({ ...p, originalIndex: i })));
            leftOrder.forEach((pair) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.textContent = pair.left;
                card.dataset.index = pair.originalIndex;
                card.onclick = () => selectCard('left', pair.originalIndex, card);
                leftColumn.appendChild(card);
                leftCards[pair.originalIndex] = card;
            });

            const rightOrder = shuffleArray(pairs.map((p, i) => ({ ...p, originalIndex: i })));
            rightOrder.forEach((pair) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.textContent = pair.right;
                card.dataset.originalIndex = pair.originalIndex;
                card.onclick = () => selectCard('right', pair.originalIndex, card);
                rightColumn.appendChild(card);
                rightCards[pair.originalIndex] = card;
            });
        }

        function selectCard(side, index, cardElement) {
            if (cardElement.classList.contains('matched')) return;
            const feedback = document.getElementById('feedback');

            if (side === 'left') {
                if (selectedLeft && selectedLeft !== cardElement) {
                    selectedLeft.classList.remove('selected');
                }
                selectedLeft = cardElement;
                cardElement.classList.add('selected');
                feedback.textContent = '';
            } else if (!selectedLeft) {
                feedback.textContent = '👈 Pilih dulu kartu di kolom kiri!';
                feedback.className = 'feedback';
            } else {
                if (selectedLeft.dataset.index == index) {
                    selectedLeft.classList.add('matched');
                    selectedLeft.classList.remove('selected');
                    cardElement.classList.add('matched');
                    matchedCount++;

                    feedback.textContent = '✓ Cocok!';
                    feedback.className = 'feedback correct';
                    document.getElementById('score').textContent = `Pasangan ditemukan: ${matchedCount}/${pairs.length}`;
                    playSfx('correct');

                    selectedLeft = null;

                    if (matchedCount === pairs.length) {
                        setTimeout(showFinish, 500);
                    }
                } else {
                    feedback.textContent = '✗ Tidak cocok!';
                    feedback.className = 'feedback wrong';
                    playSfx('wrong');
                    selectedLeft.classList.remove('selected');
                    selectedLeft = null;
                }
            }
        }

        function showFinish() {
            playSfx('finish');
            const container = document.querySelector('.container');
            container.innerHTML = `
                <h2 style="color: #9b59b6; margin-bottom: 20px;">🎉 Selesai!</h2>
                <p style="font-size: 24px; color: #2c3e50; margin: 20px 0;">Semua pasangan ditemukan!</p>
                <p style="font-size: 16px; color: #666;">⭐ Luar biasa! Kamu hebat!</p>
                <div style="display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;">
                    <button class="btn-next" style="margin:0;" onclick="startGame()">🔄 Main Lagi</button>
                    <a href="../" class="btn-outline">Kembali</a>
                </div>
            `;
        }

        startGame();
    </script>
</body>
</html>
