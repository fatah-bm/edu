<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suku Kata</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../../../assets/shared.css">
    <style>
        .level-info {
            font-size: 15px;
            color: #999;
            margin: 0 0 12px 0;
            font-weight: bold;
        }
        .word-emoji {
            font-size: 64px;
            margin: 0 0 16px 0;
            line-height: 1;
        }
        .program-row:empty::before {
            content: 'Ketuk suku kata di bawah untuk menyusun kata';
            color: #aaa;
            font-size: 13px;
            align-self: center;
        }
        .bank {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-start;
            min-height: 52px;
            margin: 0 0 16px 0;
            padding: 8px;
            border-radius: 12px;
            background: #eafaf1;
        }
        .bank:empty::before {
            content: 'Semua suku kata sudah dipakai';
            color: #aaa;
            font-size: 13px;
            align-self: center;
        }
    </style>
</head>
<body data-theme="indonesia">
    <div id="topbar"></div>
    <script src="../../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'Suku Kata', backHref: '../', homeHref: '../../../', audio: true });
    </script>

    <div class="container" id="container">
        <p class="level-info" id="levelInfo">Kata 1/8</p>
        <div class="word-emoji" id="wordEmoji"></div>
        <div class="program-row" id="susunanRow"></div>
        <div class="bank" id="bank"></div>
        <div class="controls-row">
            <button class="btn-action btn-run" id="cekBtn" disabled onclick="checkAnswer()">✅ Cek</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="score" id="score">Skor: 0/0</div>
        <div class="controls-row" id="resultActions" style="display:none;">
            <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Soal Berikutnya</button>
        </div>
    </div>

    <script>
        const ROUND_SIZE = 8;
        const WORD_BANK = [
            { word: 'ibu',        syllables: ['i', 'bu'],              emoji: '👩' },
            { word: 'kakek',      syllables: ['ka', 'kek'],            emoji: '👴' },
            { word: 'nenek',      syllables: ['ne', 'nek'],            emoji: '👵' },
            { word: 'bola',       syllables: ['bo', 'la'],             emoji: '⚽' },
            { word: 'buku',       syllables: ['bu', 'ku'],             emoji: '📖' },
            { word: 'sapi',       syllables: ['sa', 'pi'],             emoji: '🐄' },
            { word: 'topi',       syllables: ['to', 'pi'],             emoji: '🎩' },
            { word: 'kaki',       syllables: ['ka', 'ki'],             emoji: '🦶' },
            { word: 'mata',       syllables: ['ma', 'ta'],             emoji: '👁️' },
            { word: 'pisang',     syllables: ['pi', 'sang'],           emoji: '🍌' },
            { word: 'kelinci',    syllables: ['ke', 'lin', 'ci'],      emoji: '🐰' },
            { word: 'matahari',   syllables: ['ma', 'ta', 'ha', 'ri'], emoji: '☀️' },
            { word: 'sepatu',     syllables: ['se', 'pa', 'tu'],       emoji: '👟' },
            { word: 'kupukupu',   syllables: ['ku', 'pu', 'ku', 'pu'], emoji: '🦋' },
            { word: 'lalulintas', syllables: ['la', 'lu', 'lin', 'tas'], emoji: '🚦' }
        ];

        let roundWords = [];
        let currentQuestion = 0;
        let score = 0;
        let currentWord = null;
        let bankChips = [];
        let placedOrder = [];
        let checking = false;

        function tapBank(id) {
            if (checking) return;
            if (placedOrder.includes(id)) return;
            placedOrder.push(id);
            renderAll();
        }

        function tapSusunan(id) {
            if (checking) return;
            placedOrder = placedOrder.filter(x => x !== id);
            renderAll();
        }

        function renderAll() {
            renderBank();
            renderSusunan();
            document.getElementById('cekBtn').disabled = placedOrder.length !== currentWord.syllables.length;
        }

        function renderBank() {
            const bank = document.getElementById('bank');
            bank.innerHTML = '';
            bankChips.forEach(chip => {
                if (placedOrder.includes(chip.id)) return;
                const el = document.createElement('div');
                el.className = 'chip';
                el.textContent = chip.text;
                el.onclick = () => tapBank(chip.id);
                bank.appendChild(el);
            });
        }

        function renderSusunan() {
            const row = document.getElementById('susunanRow');
            row.innerHTML = '';
            placedOrder.forEach(id => {
                const chip = bankChips.find(c => c.id === id);
                const el = document.createElement('div');
                el.className = 'chip';
                el.textContent = chip.text;
                el.onclick = () => tapSusunan(id);
                row.appendChild(el);
            });
        }

        function checkAnswer() {
            if (checking) return;
            const correct = placedOrder.length === currentWord.syllables.length &&
                             placedOrder.every((id, i) => id === i);
            const feedback = document.getElementById('feedback');

            if (correct) {
                checking = true;
                score++;
                updateScore();
                playSfx('correct');
                confetti({ particleCount: 70, spread: 70, origin: { y: 0.6 } });
                speak(currentWord.word);
                feedback.textContent = `🎉 Benar! "${currentWord.word}"`;
                feedback.className = 'feedback correct';
                document.getElementById('resultActions').style.display = 'flex';
                document.getElementById('nextBtn').textContent =
                    currentQuestion === roundWords.length - 1 ? 'Selesai' : 'Soal Berikutnya';
            } else {
                document.querySelectorAll('#susunanRow .chip').forEach(c => c.classList.add('error'));
                playSfx('wrong');
                feedback.textContent = '🤔 Belum tepat urutannya, coba lagi!';
                feedback.className = 'feedback wrong';
                setTimeout(() => {
                    placedOrder = [];
                    renderAll();
                    feedback.textContent = '';
                    feedback.className = 'feedback';
                }, 900);
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = `Skor: ${score}/${currentQuestion + 1}`;
        }

        function loadQuestion() {
            currentWord = roundWords[currentQuestion];
            bankChips = shuffleArray(currentWord.syllables.map((text, id) => ({ id, text })));
            placedOrder = [];
            checking = false;

            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('wordEmoji').textContent = currentWord.emoji;
            document.getElementById('levelInfo').textContent = `Kata ${currentQuestion + 1}/${roundWords.length}`;
            document.getElementById('resultActions').style.display = 'none';
            document.getElementById('nextBtn').textContent = 'Soal Berikutnya';
            renderAll();
            updateScore();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= roundWords.length) {
                showFinish();
            } else {
                loadQuestion();
            }
        }

        function startGame() {
            roundWords = shuffleArray(WORD_BANK).slice(0, ROUND_SIZE);
            currentQuestion = 0;
            score = 0;
            loadQuestion();
        }

        function showFinish() {
            playSfx('correct');
            const container = document.getElementById('container');
            const percentage = Math.round((score / roundWords.length) * 100);
            container.innerHTML = `
                <h2 style="color: var(--accent); margin-bottom: 20px;">🎉 Selesai!</h2>
                <p style="font-size: 24px; color: #2c3e50; margin: 20px 0;">Skor Akhir: <strong>${score}/${roundWords.length}</strong></p>
                <p style="font-size: 18px; color: #666; margin: 20px 0;">${percentage}%</p>
                <p style="font-size: 16px; color: #666;">${percentage >= 80 ? '⭐ Luar biasa!' : percentage >= 60 ? '👍 Bagus!' : '💪 Terus berlatih!'}</p>
                <div style="display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;">
                    <button class="btn-next" style="margin:0;" onclick="startGame()">🔄 Main Lagi</button>
                    <a href="../" class="btn-outline">Kembali</a>
                </div>
            `;
        }

        startGame();
    </script>
</body>
</html>
