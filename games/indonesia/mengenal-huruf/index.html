<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mengenal Huruf</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .top-bar {
            display: flex;
            align-items: center;
            max-width: 560px;
            margin: 0 auto 10px auto;
        }
        .btn-back {
            background-color: #c7ceea;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #a0a8c8;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: #333;
        }
        .btn-back:active { transform: translateY(4px); box-shadow: none; }
        .btn-home {
            background-color: #ffd166;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #ccaa33;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: #333;
        }
        .btn-home:active { transform: translateY(4px); box-shadow: none; }
        h1 {
            color: #2ecc71;
            font-size: 26px;
            margin: 0;
            flex: 1;
        }
        .subtitle {
            color: #777;
            font-size: 15px;
            margin: 0 0 12px 0;
        }
        .legend {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 0 0 16px 0;
        }
        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #555;
        }
        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }
        .legend-dot.vokal { background: #ff9800; }
        .legend-dot.konsonan { background: #3498db; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 560px;
            margin: 0 auto;
        }
        .card {
            background-color: white;
            border: 3px solid #3498db;
            border-radius: 14px;
            padding: 10px 6px;
            cursor: pointer;
            box-shadow: 0 5px 0 #2a7fb0;
            transition: transform 0.1s, box-shadow 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .card:active { transform: translateY(5px); box-shadow: none; }
        .card.vokal {
            border-color: #ff9800;
            box-shadow: 0 5px 0 #cc7a00;
        }
        .card.playing {
            border-color: #2ecc71;
            box-shadow: 0 5px 0 #27ae60;
            background-color: #f0fdf6;
        }
        .card .letter {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 4px;
            line-height: 1;
        }
        .card .upper {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
        }
        .card .lower {
            font-size: 18px;
            font-weight: bold;
            color: #666;
        }
        .card .emoji {
            display: block;
            font-size: 26px;
            margin: 6px 0 2px 0;
        }
        .card .contoh {
            display: block;
            font-size: 13px;
            color: #888;
        }
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            max-width: 560px;
            margin: 20px auto 0 auto;
        }
        .btn-page {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 22px;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #27ae60;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-page:active { transform: translateY(4px); box-shadow: none; }
        .btn-page:disabled {
            background-color: #ccc;
            box-shadow: 0 4px 0 #aaa;
            cursor: default;
        }
        .page-indicator {
            font-size: 16px;
            color: #555;
            font-weight: bold;
            min-width: 80px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="btn-back" href="../">⬅ Back</a>
        <h1>Mengenal Huruf</h1>
        <a class="btn-home" href="../../../">Home</a>
    </div>
    <p class="subtitle">Ketuk huruf untuk dengar bunyinya!</p>
    <div class="legend">
        <span class="legend-item"><span class="legend-dot vokal"></span> Huruf Vokal</span>
        <span class="legend-item"><span class="legend-dot konsonan"></span> Huruf Konsonan</span>
    </div>

    <div class="grid" id="grid"></div>

    <div class="pagination">
        <button class="btn-page" id="btn-prev" onclick="changePage(-1)">◀</button>
        <span class="page-indicator" id="page-indicator"></span>
        <button class="btn-page" id="btn-next" onclick="changePage(1)">▶</button>
    </div>

    <script>
        const LETTERS = [
            { letter: 'A', type: 'vokal',     contoh: 'Apel',    emoji: '🍎' },
            { letter: 'B', type: 'konsonan',  contoh: 'Bola',    emoji: '⚽' },
            { letter: 'C', type: 'konsonan',  contoh: 'Cicak',   emoji: '🦎' },
            { letter: 'D', type: 'konsonan',  contoh: 'Dadu',    emoji: '🎲' },
            { letter: 'E', type: 'vokal',     contoh: 'Ember',   emoji: '🪣' },
            { letter: 'F', type: 'konsonan',  contoh: 'Foto',    emoji: '📷' },
            { letter: 'G', type: 'konsonan',  contoh: 'Gajah',   emoji: '🐘' },
            { letter: 'H', type: 'konsonan',  contoh: 'Hujan',   emoji: '🌧️' },
            { letter: 'I', type: 'vokal',     contoh: 'Ikan',    emoji: '🐟' },
            { letter: 'J', type: 'konsonan',  contoh: 'Jam',     emoji: '⏰' },
            { letter: 'K', type: 'konsonan',  contoh: 'Kuda',    emoji: '🐴' },
            { letter: 'L', type: 'konsonan',  contoh: 'Lampu',   emoji: '💡' },
            { letter: 'M', type: 'konsonan',  contoh: 'Meja',    emoji: '🪑' },
            { letter: 'N', type: 'konsonan',  contoh: 'Nasi',    emoji: '🍚' },
            { letter: 'O', type: 'vokal',     contoh: 'Obat',    emoji: '💊' },
            { letter: 'P', type: 'konsonan',  contoh: 'Pisang',  emoji: '🍌' },
            { letter: 'Q', type: 'konsonan',  contoh: 'Quran',   emoji: '📖' },
            { letter: 'R', type: 'konsonan',  contoh: 'Rumah',   emoji: '🏠' },
            { letter: 'S', type: 'konsonan',  contoh: 'Susu',    emoji: '🥛' },
            { letter: 'T', type: 'konsonan',  contoh: 'Topi',    emoji: '🎩' },
            { letter: 'U', type: 'vokal',     contoh: 'Ular',    emoji: '🐍' },
            { letter: 'V', type: 'konsonan',  contoh: 'Vas',     emoji: '🏺' },
            { letter: 'W', type: 'konsonan',  contoh: 'Wortel',  emoji: '🥕' },
            { letter: 'X', type: 'konsonan',  contoh: 'Xilofon', emoji: '🎷' },
            { letter: 'Y', type: 'konsonan',  contoh: 'Yoyo',    emoji: '🪀' },
            { letter: 'Z', type: 'konsonan',  contoh: 'Zebra',   emoji: '🦓' }
        ];

        const PER_PAGE = 6;
        let currentPage = 0;
        const totalPages = Math.ceil(LETTERS.length / PER_PAGE);

        function renderPage() {
            const grid = document.getElementById('grid');
            const pageLetters = LETTERS.slice(currentPage * PER_PAGE, (currentPage + 1) * PER_PAGE);

            grid.innerHTML = pageLetters.map((L, idx) => `
                <div class="card ${L.type}" data-idx="${currentPage * PER_PAGE + idx}">
                    <span class="letter">
                        <span class="upper">${L.letter}</span>
                        <span class="lower">${L.letter.toLowerCase()}</span>
                    </span>
                    <span class="emoji">${L.emoji}</span>
                    <span class="contoh">${L.contoh}</span>
                </div>
            `).join('');

            grid.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', () => {
                    const L = LETTERS[Number(card.dataset.idx)];
                    speakSequence([L.letter, L.contoh], card);
                });
            });

            document.getElementById('page-indicator').textContent = `${currentPage + 1} / ${totalPages}`;
            document.getElementById('btn-prev').disabled = currentPage === 0;
            document.getElementById('btn-next').disabled = currentPage === totalPages - 1;
        }

        function changePage(dir) {
            currentPage += dir;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ── Speech (Bahasa Indonesia) ───────────────────────────────────────
        let _idVoice = null;
        function _loadIdVoice() {
            const voices = window.speechSynthesis.getVoices();
            _idVoice = voices.find(v => v.lang === 'id-ID') ||
                       voices.find(v => v.lang.startsWith('id')) ||
                       null;
        }
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = _loadIdVoice;
        }
        _loadIdVoice();

        // Ucapkan beberapa teks berurutan (huruf lalu contoh kata), dirangkai
        // via utterance.onend agar tidak saling membatalkan satu sama lain.
        function speakSequence(texts, card) {
            window.speechSynthesis.cancel();
            let i = 0;
            if (card) card.classList.add('playing');

            function speakNext() {
                if (i >= texts.length) {
                    if (card) card.classList.remove('playing');
                    return;
                }
                const utter = new SpeechSynthesisUtterance(texts[i]);
                utter.lang = 'id-ID';
                utter.rate = 0.85;
                utter.pitch = 1.1;
                if (_idVoice) utter.voice = _idVoice;
                utter.onend = () => { i++; speakNext(); };
                utter.onerror = () => { i++; speakNext(); };
                window.speechSynthesis.speak(utter);
            }

            if (!_idVoice && window.speechSynthesis.getVoices().length === 0) {
                const prev = window.speechSynthesis.onvoiceschanged;
                window.speechSynthesis.onvoiceschanged = () => {
                    _loadIdVoice();
                    window.speechSynthesis.onvoiceschanged = prev || null;
                    speakNext();
                };
            } else {
                speakNext();
            }
        }

        renderPage();
    </script>
</body>
</html>
