<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menulis Huruf</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #f0f8ff 0%, #e8f4f8 100%);
            margin: 0;
            padding: 16px;
            text-align: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }
        .top-bar {
            display: flex;
            align-items: center;
            max-width: 460px;
            margin: 0 auto 20px auto;
        }
        .btn-back {
            background-color: #c7ceea;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #a0a8c8;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: #333;
        }
        .btn-back:active { transform: translateY(4px); box-shadow: none; }
        .btn-home {
            background-color: #ffd166;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #ccaa33;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: #333;
        }
        .btn-home:active { transform: translateY(4px); box-shadow: none; }
        h1 {
            color: #2ecc71;
            font-size: 26px;
            margin: 0;
            flex: 1;
        }
        .container {
            max-width: 460px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .progress {
            font-size: 15px;
            color: #999;
            margin: 0 0 16px 0;
            font-weight: bold;
        }
        .trace-wrap {
            position: relative;
            width: min(78vw, 280px);
            height: min(78vw, 280px);
            margin: 0 auto 16px auto;
            border-radius: 20px;
            background: #fafafa;
            border: 3px solid #2ecc71;
            overflow: hidden;
        }
        .trace-wrap canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #guideCanvas { z-index: 1; }
        #drawCanvas { z-index: 2; }
        .controls-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 0 0 16px 0;
        }
        .btn-action {
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-run {
            background: #2ecc71;
            color: white;
            box-shadow: 0 4px 0 #27ae60;
        }
        .btn-run:active { transform: translateY(4px); box-shadow: none; }
        .btn-secondary {
            background: white;
            color: #2ecc71;
            border: 2px solid #2ecc71;
        }
        .btn-secondary:active { transform: translateY(2px); }
        .feedback {
            font-size: 18px;
            margin: 8px 0;
            font-weight: bold;
            min-height: 26px;
        }
        .feedback.correct { color: #4caf50; }
        .feedback.wrong { color: #f44336; }
        .score {
            font-size: 16px;
            color: #666;
            margin: 12px 0;
        }
        .btn-next {
            background-color: #2ecc71;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #27ae60;
            color: white;
            margin: 4px 0;
        }
        .btn-next:active { transform: translateY(4px); box-shadow: none; }
        .btn-next:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            box-shadow: 0 4px 0 #999;
        }
        .btn-outline {
            display: inline-block;
            padding: 12px 24px;
            background: white;
            color: #2ecc71;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            border: 3px solid #2ecc71;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="btn-back" href="../">⬅ Back</a>
        <h1>Menulis Huruf</h1>
        <a class="btn-home" href="../../../">Home</a>
    </div>

    <div class="container" id="container">
        <p class="progress" id="progress">Huruf 1/26</p>
        <div class="trace-wrap" id="traceWrap">
            <canvas id="guideCanvas"></canvas>
            <canvas id="drawCanvas"></canvas>
        </div>
        <div class="controls-row">
            <button class="btn-action btn-secondary" onclick="clearDraw()">🗑️ Hapus</button>
            <button class="btn-action btn-run" onclick="checkTrace()">✅ Cek</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="score" id="score">Skor: 0</div>
        <button class="btn-next" id="lanjutBtn" disabled onclick="nextLetter()">Huruf Berikutnya</button>
    </div>

    <script>
        const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        const GRID = 48;
        const CELL_ALPHA_MIN = 24;
        const DILATE = 1;
        const PASS_THRESHOLD = 0.55;

        let currentIndex = 0;
        let score = 0;
        let retriedThisLetter = false;
        let passed = false;
        let checking = false;

        let guideCtx, drawCtx, canvasCssW, canvasCssH;
        let drawing = false, lastX = 0, lastY = 0, hasInk = false;

        const guideCanvas = document.getElementById('guideCanvas');
        const drawCanvas = document.getElementById('drawCanvas');

        function setupCanvas(canvas) {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            const ctx = canvas.getContext('2d');
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            return { ctx, w: rect.width, h: rect.height };
        }

        function loadLetterCanvas() {
            const g = setupCanvas(guideCanvas);
            const d = setupCanvas(drawCanvas);
            guideCtx = g.ctx;
            drawCtx = d.ctx;
            canvasCssW = g.w;
            canvasCssH = g.h;

            guideCtx.clearRect(0, 0, canvasCssW, canvasCssH);
            guideCtx.fillStyle = 'rgba(150,150,150,0.35)';
            guideCtx.font = `bold ${Math.floor(canvasCssH * 0.72)}px 'Comic Sans MS', sans-serif`;
            guideCtx.textAlign = 'center';
            guideCtx.textBaseline = 'middle';
            guideCtx.fillText(LETTERS[currentIndex], canvasCssW / 2, canvasCssH / 2 + canvasCssH * 0.04);

            drawCtx.clearRect(0, 0, canvasCssW, canvasCssH);
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.strokeStyle = '#2ecc71';
            drawCtx.lineWidth = 18;
            hasInk = false;
        }

        function getPos(e) {
            const r = drawCanvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        drawCanvas.addEventListener('pointerdown', e => {
            if (checking) return;
            drawing = true;
            hasInk = true;
            drawCanvas.setPointerCapture(e.pointerId);
            const p = getPos(e);
            lastX = p.x; lastY = p.y;
            drawCtx.beginPath();
            drawCtx.moveTo(p.x, p.y);
            drawCtx.lineTo(p.x + 0.01, p.y + 0.01);
            drawCtx.stroke();
            e.preventDefault();
        });
        drawCanvas.addEventListener('pointermove', e => {
            if (!drawing) return;
            const p = getPos(e);
            drawCtx.beginPath();
            drawCtx.moveTo(lastX, lastY);
            drawCtx.lineTo(p.x, p.y);
            drawCtx.stroke();
            lastX = p.x; lastY = p.y;
        });
        function endStroke() { drawing = false; }
        drawCanvas.addEventListener('pointerup', endStroke);
        drawCanvas.addEventListener('pointercancel', endStroke);
        document.addEventListener('pointercancel', endStroke);

        function clearDraw() {
            if (checking) return;
            drawCtx.clearRect(0, 0, canvasCssW, canvasCssH);
            hasInk = false;
            showFeedback('', true);
        }

        function coverageFraction() {
            const g1 = document.createElement('canvas'); g1.width = GRID; g1.height = GRID;
            const g2 = document.createElement('canvas'); g2.width = GRID; g2.height = GRID;
            const gc = g1.getContext('2d'), uc = g2.getContext('2d');
            gc.drawImage(guideCanvas, 0, 0, GRID, GRID);
            uc.drawImage(drawCanvas, 0, 0, GRID, GRID);
            const gData = gc.getImageData(0, 0, GRID, GRID).data;
            const uData = uc.getImageData(0, 0, GRID, GRID).data;

            let guideCells = 0, coveredCells = 0;
            for (let y = 0; y < GRID; y++) {
                for (let x = 0; x < GRID; x++) {
                    const i = (y * GRID + x) * 4;
                    if (gData[i + 3] < CELL_ALPHA_MIN) continue;
                    guideCells++;
                    let hit = false;
                    for (let dy = -DILATE; dy <= DILATE && !hit; dy++) {
                        for (let dx = -DILATE; dx <= DILATE && !hit; dx++) {
                            const nx = x + dx, ny = y + dy;
                            if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) continue;
                            if (uData[(ny * GRID + nx) * 4 + 3] >= CELL_ALPHA_MIN) hit = true;
                        }
                    }
                    if (hit) coveredCells++;
                }
            }
            return guideCells === 0 ? 0 : coveredCells / guideCells;
        }

        function showFeedback(text, ok) {
            const fb = document.getElementById('feedback');
            fb.textContent = text;
            fb.className = 'feedback' + (text ? (ok ? ' correct' : ' wrong') : '');
        }

        function checkTrace() {
            if (checking) return;
            if (!hasInk) {
                showFeedback('Warnai huruf itu dulu ya!', false);
                return;
            }
            const coverage = coverageFraction();
            if (coverage >= PASS_THRESHOLD) {
                passed = true;
                checking = true;
                score += retriedThisLetter ? 5 : 10;
                showFeedback('Bagus! 🎉', true);
                playSfx('correct');
                confetti({ particleCount: 60, spread: 65, origin: { y: 0.6 } });
                document.getElementById('lanjutBtn').disabled = false;
            } else {
                retriedThisLetter = true;
                showFeedback('Coba lagi, warnai semua hurufnya ya!', false);
                playSfx('wrong');
            }
            updateScore();
        }

        function updateScore() {
            document.getElementById('score').textContent = `Skor: ${score}`;
        }

        function loadQuestion() {
            passed = false;
            checking = false;
            retriedThisLetter = false;
            document.getElementById('progress').textContent = `Huruf ${currentIndex + 1}/${LETTERS.length}`;
            document.getElementById('lanjutBtn').disabled = true;
            showFeedback('', true);
            loadLetterCanvas();
            updateScore();
        }

        function nextLetter() {
            if (!passed) return;
            currentIndex++;
            if (currentIndex >= LETTERS.length) {
                showFinish();
            } else {
                loadQuestion();
            }
        }

        function showFinish() {
            playSfx('correct');
            const container = document.getElementById('container');
            container.innerHTML = `
                <h2 style="color: #2ecc71; margin-bottom: 20px;">🎉 Selesai!</h2>
                <p style="font-size: 24px; color: #2c3e50; margin: 20px 0;">Skor Akhir: <strong>${score}</strong></p>
                <p style="font-size: 16px; color: #666;">Kamu sudah menulis semua huruf A-Z!</p>
                <div style="display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;">
                    <button class="btn-next" style="margin:0;" onclick="location.reload()">🔄 Main Lagi</button>
                    <a href="../" class="btn-outline">Kembali</a>
                </div>
            `;
        }

        // ── SFX (Web Audio API oscillator) ──────────────────────────────────
        function playSfx(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(1000, ctx.currentTime + 0.3);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
                }
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {}
        }

        loadQuestion();
    </script>
</body>
</html>
