<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bahasa Indonesia</title>
    <link rel="stylesheet" href="../../assets/shared.css">
    <style>
        .subtitle {
            color: #888;
            font-size: 15px;
            margin: 0 0 24px 0;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 560px;
            margin: 0 auto;
        }
    </style>
</head>
<body data-theme="indonesia">
    <div id="topbar"></div>
    <script src="../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'Bahasa Indonesia', backHref: '../../', homeHref: '../../' });
    </script>
    <p class="subtitle">Yuk kenal huruf, belajar menulis, dan menyusun kata!</p>

    <div class="grid">
        <a class="card card--hub" href="./mengenal-huruf/">
            <img src="https://img.icons8.com/color/96/abc.png" alt="Mengenal Huruf"
                 onerror="this.style.display='none'">
            <p>Mengenal Huruf</p>
            <small>Bunyi huruf & contoh kata</small>
        </a>
        <a class="card card--hub" href="./menulis-huruf/">
            <img src="https://img.icons8.com/color/96/pencil.png" alt="Menulis Huruf"
                 onerror="this.style.display='none'">
            <p>Menulis Huruf</p>
            <small>Jiplak huruf di layar</small>
        </a>
        <a class="card card--hub" href="./suku-kata/">
            <img src="https://img.icons8.com/color/96/puzzle.png" alt="Suku Kata"
                 onerror="this.style.display='none'">
            <p>Suku Kata</p>
            <small>Susun jadi kata utuh</small>
        </a>
    </div>
</body>
</html>
