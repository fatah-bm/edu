<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matematika</title>
    <link rel="stylesheet" href="../../assets/shared.css">
    <style>
        .subtitle {
            color: #888;
            font-size: 15px;
            margin: 0 0 24px 0;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 560px;
            margin: 0 auto;
        }
    </style>
</head>
<body data-theme="math">
    <div id="topbar"></div>
    <script src="../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'Matematika', backHref: '../../', homeHref: '../../' });
    </script>
    <p class="subtitle">Pilih materi</p>

    <div class="grid">
        <a class="card card--hub" href="./tambahkali/">
            <img src="https://img.icons8.com/color/96/plus-math.png" alt="Operasi Hitung"
                 onerror="this.style.display='none'">
            <p>Tambah, Kurang, Kali & Bagi</p>
            <small>Empat operasi hitung dasar</small>
        </a>
        <a class="card card--hub" href="./nilai-tempat/">
            <img src="https://img.icons8.com/color/96/abacus.png" alt="Nilai Tempat"
                 onerror="this.style.display='none'">
            <p>Nilai Tempat</p>
            <small>Satuan, puluhan, ratusan</small>
        </a>
        <a class="card card--hub" href="./uang/">
            <img src="https://img.icons8.com/color/96/coins.png" alt="Uang"
                 onerror="this.style.display='none'">
            <p>Uang</p>
            <small>Kenali & hitung uang Rupiah</small>
        </a>
    </div>
</body>
</html>
