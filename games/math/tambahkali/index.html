<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Pintar Matematika</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../../../assets/shared.css">
    <style>
        body { user-select: none; -webkit-user-select: none; }

        .avatar-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        .avatar {
            width: 60px;
            height: 60px;
            background-color: white;
            border-radius: 50%;
            border: 3px solid #ffd166;
        }

        .box-container {
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 5px solid #4ecdc4;
        }
        .btn {
            font-family: inherit;
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 20px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: translateY(5px); box-shadow: none; }

        /* Palet Warna Tombol */
        .btn-add { background-color: #ff6b6b; }
        .btn-sub { background-color: #ff9f43; }
        .btn-mul { background-color: #4ecdc4; }
        .btn-div { background-color: #00b894; }
        .btn-mix { background-color: #9b59b6; }
        .btn-mode-prac { background-color: #3498db; }
        .btn-mode-chal { background-color: #e67e22; }
        .btn-lvl-easy { background-color: #2ecc71; }
        .btn-lvl-med { background-color: #f39c12; }
        .btn-lvl-hard { background-color: #e74c3c; }
        .btn-lvl-expert { background-color: #34495e; }
        .btn-find { background-color: #8e44ad; }
        .btn-grade1 { background-color: #1abc9c; }
        .btn-grade2 { background-color: #d35400; }
        /* In-wizard "go back a step" / "stop & see result" button — distinct from
           the top-bar's .btn-back (parent-folder nav), so it gets its own class. */
        .btn-wizard-back { background-color: #c7ceea; color: #333; font-size: 16px; margin-top: 15px; }

        #countdown-number {
            font-size: 96px;
            font-weight: bold;
            color: var(--accent);
            line-height: 1.1;
            margin: 10px 0;
        }
        #countdown-info {
            font-size: 15px;
            color: #888;
            margin-bottom: 5px;
        }
        #question {
            font-size: 45px;
            font-weight: bold;
            margin: 15px 0;
            color: #1a535c;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 10px;
        }
        .btn-option {
            background-color: #ffd166;
            color: #333;
            font-size: 32px;
            height: 80px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 5px 0 #d4a942;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-option:active { transform: translateY(5px); box-shadow: none; }

        #score-board {
            font-size: 18px;
            color: #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #eee;
            padding-bottom: 10px;
        }
        .info-badge { background: #eee; padding: 5px 10px; border-radius: 10px; font-size: 14px; }
        #timer-badge { background: #ffeaa7; color: #d35400; font-weight: bold; }

        /* Style Layar Review */
        .review-container {
            max-height: 300px;
            overflow-y: auto;
            text-align: left;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
            border: 2px solid #ddd;
        }
        .review-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 15px;
            line-height: 1.4;
        }
        .review-item:last-child { border-bottom: none; }
        .review-item.correct { border-left: 5px solid #2ecc71; }
        .review-item.warning { border-left: 5px solid #f39c12; }
        .review-item.wrong { border-left: 5px solid #e74c3c; background-color: #ffeaea; }
    </style>
</head>
<body data-theme="math">

    <div id="topbar"></div>
    <script src="../../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'Matematika Seru!', backHref: '../', homeHref: '../../../', audio: true });
    </script>

    <div class="avatar-container">
        <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=Jagoan&backgroundColor=b6e3f4" class="avatar" alt="Karakter Laki-laki">
        <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=Bintang&backgroundColor=ffdfbf" class="avatar" alt="Karakter Perempuan">
    </div>

    <audio id="bgm" src="https://upload.wikimedia.org/wikipedia/commons/3/34/8_Bit_Surf.ogg" loop></audio>

    <div id="screen-type" class="box-container">
        <h2>Pilih Cara Main:</h2>
        <button class="btn btn-mode-prac" onclick="selectType('practice')">🎯 Latihan Santai</button>
        <button class="btn btn-mode-chal" onclick="selectType('challenge')">⏱️ Tantangan 2 Menit</button>
    </div>

    <div id="screen-operation" class="box-container" style="display: none;">
        <h2>Pilih Pelajaran:</h2>
        <button class="btn btn-add" onclick="selectOperation('add')">➕ Penjumlahan</button>
        <button class="btn btn-sub" onclick="selectOperation('sub')">➖ Pengurangan</button>
        <button class="btn btn-mul" onclick="selectOperation('mul')">✖️ Perkalian</button>
        <button class="btn btn-div" onclick="selectOperation('div')">➗ Pembagian</button>
        <button class="btn btn-mix" onclick="selectOperation('mixTK')">🎲 Campuran (Tambah & Kali)</button>
        <button class="btn btn-mix" onclick="selectOperation('mixKB')">🎲 Campuran (Kurang & Bagi)</button>
        <button class="btn btn-find" onclick="selectOperation('findTK')">🔍 Cari Yang Hilang (Tambah & Kali)</button>
        <button class="btn btn-find" onclick="selectOperation('findKB')">🔍 Cari Yang Hilang (Kurang & Bagi)</button>
        <button class="btn btn-wizard-back" onclick="showScreen('screen-type')">⬅️ Kembali</button>
    </div>

    <div id="screen-grade" class="box-container" style="display: none;">
        <h2>Pilih Kelas:</h2>
        <button class="btn btn-grade1" onclick="selectGrade('grade1')">1️⃣ Kelas 1</button>
        <button class="btn btn-grade2" onclick="selectGrade('grade2')">2️⃣ Kelas 2</button>
        <button class="btn btn-wizard-back" onclick="showScreen('screen-operation')">⬅️ Kembali</button>
    </div>

    <div id="screen-countdown" class="box-container" style="display: none;">
        <p id="countdown-info"></p>
        <div id="countdown-number">3</div>
        <p style="color:#aaa; font-size:14px;">Siapkan jarimu! ☝️</p>
    </div>

    <div id="screen-level" class="box-container" style="display: none;">
        <h2 id="level-title">Pilih Level:</h2>
        <button class="btn btn-lvl-easy" onclick="selectLevel('easy')">🌟 Mudah</button>
        <button class="btn btn-lvl-med" onclick="selectLevel('medium')">⭐⭐ Sedang</button>
        <button class="btn btn-lvl-hard" onclick="selectLevel('hard')">🔥 Sulit</button>
        <button class="btn btn-lvl-expert" id="btn-lvl-expert" onclick="selectLevel('expert')" style="display:none;">🏆 Mahir</button>
        <button class="btn btn-wizard-back" onclick="goBackFromLevel()">⬅️ Kembali</button>
    </div>

    <div id="screen-game" class="box-container" style="display: none;">
        <div id="score-board">
            <span class="info-badge" id="game-info">Mode</span>
            <span class="info-badge" id="timer-badge" style="display:none;">⏱️ <span id="time-left">120</span>s</span>
            <span>Skor: <strong id="score">0</strong></span>
        </div>

        <div id="question">1 + 1 = ?</div>

        <div class="options-grid">
            <button class="btn-option" onclick="checkAnswer(0)" id="opt0">1</button>
            <button class="btn-option" onclick="checkAnswer(1)" id="opt1">2</button>
            <button class="btn-option" onclick="checkAnswer(2)" id="opt2">3</button>
            <button class="btn-option" onclick="checkAnswer(3)" id="opt3">4</button>
        </div>

        <div id="feedback" class="feedback"></div>
        <button class="btn btn-wizard-back" onclick="endGameEarly()">⏹️ Berhenti & Lihat Hasil</button>
    </div>

    <div id="screen-result" class="box-container" style="display: none;">
        <h2>Sesi Selesai! 🎉</h2>
        <h3 style="color: #f39c12;">Total Skor: <span id="final-score">0</span></h3>
        <p>Review Jawabanmu:</p>
        <div id="review-list" class="review-container">
            </div>
        <button class="btn btn-add" onclick="showScreen('screen-type')" style="margin-top: 20px;">Main Lagi</button>
    </div>

    <script>
        // Variabel Game
        let gameType = '';
        let currentOperation = '';
        let currentGrade = '';
        let currentLevel = '';
        let levelBackScreen = 'screen-grade'; // layar tujuan tombol Kembali di screen-level
        let score = 0;
        let isProcessing = false;

        // Variabel Tracking & Timer
        let timerInterval;
        let timeLeft = 120;
        let gameHistory = [];
        let currentQuestionData = {}; // Object untuk melacak state soal yang sedang aktif

        // ── BGM (musik latar) ────────────────────────────────────────────────
        // SFX + mute toggle datang dari shared.js (window.playSfx / window.toggleAudio /
        // window.isAudioEnabled) — di sini kita hanya menyambungkan BGM ke toggle itu.
        const bgm = document.getElementById('bgm');
        bgm.volume = 0.3;

        const _sharedToggleAudio = window.toggleAudio;
        window.toggleAudio = function () {
            const enabled = _sharedToggleAudio();
            if (enabled) {
                bgm.play().catch(e => console.log('BGM play error:', e));
            } else {
                bgm.pause();
            }
            return enabled;
        };

        function playTick() {
            const urgent = timeLeft <= 10;
            playSfx(urgent ? 'wrong' : 'tick');
        }

        // Navigasi UI
        function showScreen(screenId) {
            const screens = ['screen-type', 'screen-operation', 'screen-grade', 'screen-level', 'screen-countdown', 'screen-game', 'screen-result'];
            screens.forEach(id => document.getElementById(id).style.display = 'none');
            document.getElementById(screenId).style.display = 'block';
        }

        function selectType(type) {
            if (window.isAudioEnabled) bgm.play().catch(e => console.log(e));
            gameType = type;
            showScreen('screen-operation');
        }

        const OP_TITLES = {
            add: 'Penjumlahan', sub: 'Pengurangan', mul: 'Perkalian', div: 'Pembagian',
            mixTK: 'Campuran (Tambah & Kali)', mixKB: 'Campuran (Kurang & Bagi)',
            findTK: 'Cari Yang Hilang (Tambah & Kali)', findKB: 'Cari Yang Hilang (Kurang & Bagi)'
        };
        const OP_EMOJIS = {
            add: '➕', sub: '➖', mul: '✖️', div: '➗',
            mixTK: '🎲', mixKB: '🎲', findTK: '🔍', findKB: '🔍'
        };
        // Kelas mana saja yang valid untuk tiap operasi — Perkalian & Pembagian (serta
        // gabungannya) baru diajarkan mulai Kelas 2, jadi tidak punya opsi Kelas 1.
        const OP_GRADES = {
            add: ['grade1', 'grade2'], sub: ['grade1', 'grade2'],
            mul: ['grade2'], div: ['grade2'],
            mixTK: ['grade2'], mixKB: ['grade2'], findTK: ['grade2'], findKB: ['grade2']
        };
        // Operasi dasar yang diacak untuk mode Campuran/Cari Yang Hilang yang fokus per pasangan
        const OP_POOLS = {
            mixTK: ['add', 'mul'], mixKB: ['sub', 'div'],
            findTK: ['add', 'mul'], findKB: ['sub', 'div']
        };

        function selectOperation(op) {
            currentOperation = op;
            const grades = OP_GRADES[op];
            if (grades.length === 1) {
                // Cuma satu kelas yang valid (mis. Perkalian = Kelas 2 saja) — lewati layar pilih kelas
                currentGrade = grades[0];
                levelBackScreen = 'screen-operation';
                prepareLevelScreen();
                showScreen('screen-level');
            } else {
                levelBackScreen = 'screen-grade';
                showScreen('screen-grade');
            }
        }

        function selectGrade(grade) {
            currentGrade = grade;
            prepareLevelScreen();
            showScreen('screen-level');
        }

        function prepareLevelScreen() {
            const gradeLabel = currentGrade === 'grade1' ? 'Kelas 1' : 'Kelas 2';
            document.getElementById('level-title').innerText = `Level ${OP_TITLES[currentOperation]} (${gradeLabel}):`;
            // "Mahir" cuma tersedia di Kelas 2 (angka lebih besar + menyimpan/meminjam)
            document.getElementById('btn-lvl-expert').style.display = currentGrade === 'grade2' ? 'block' : 'none';
        }

        function goBackFromLevel() {
            showScreen(levelBackScreen);
        }

        function selectLevel(lvl) {
            currentLevel = lvl;
            score = 0;
            gameHistory = [];
            document.getElementById('score').innerText = score;

            const gradeLabel = currentGrade === 'grade1' ? 'K1' : 'K2';
            let lvlName = lvl === 'easy' ? 'Mudah' : (lvl === 'medium' ? 'Sedang' : (lvl === 'hard' ? 'Sulit' : 'Mahir'));
            document.getElementById('game-info').innerText = `${OP_EMOJIS[currentOperation]} | ${gradeLabel} | ${lvlName}`;

            if (gameType === 'challenge') {
                document.getElementById('timer-badge').style.display = 'inline-block';
                showCountdown();
            } else {
                document.getElementById('timer-badge').style.display = 'none';
                showScreen('screen-game');
                generateQuestion();
            }
        }

        function showCountdown() {
            showScreen('screen-countdown');
            document.getElementById('countdown-info').innerText =
                `⏱️ Tantangan 2 Menit  ·  ${document.getElementById('game-info').innerText}`;

            const el = document.getElementById('countdown-number');
            el.innerText = '3';
            setTimeout(() => { el.innerText = '2'; }, 1000);
            setTimeout(() => { el.innerText = '1'; }, 2000);
            setTimeout(() => { el.innerText = 'Mulai! 🚀'; }, 3000);
            setTimeout(() => {
                showScreen('screen-game');
                generateQuestion();
                startTimer();
            }, 3700);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 120;
            document.getElementById('time-left').innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSfx('finish');
                    finishGame();
                } else {
                    playTick();
                }
            }, 1000);
        }

        function endGameEarly() {
            clearInterval(timerInterval);
            // Jika soal saat ini pernah dijawab salah tapi belum terselesaikan sebelum di-stop
            if (!currentQuestionData.solved && currentQuestionData.mistakes > 0) {
                gameHistory.push({ ...currentQuestionData });
            }
            finishGame();
        }

        function generateQuestion() {
            isProcessing = false;
            document.getElementById('feedback').innerText = '';

            let num1, num2;
            let activeOp = currentOperation;
            const isFindMode = currentOperation === 'findTK' || currentOperation === 'findKB';
            const pool = OP_POOLS[currentOperation];
            if (pool) {
                activeOp = pool[Math.floor(Math.random() * pool.length)];
            }

            let symbol = { add: '+', sub: '-', mul: 'x', div: ':' }[activeOp];
            let result = 0;
            const R = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

            if (activeOp === 'add') {
                if (currentGrade === 'grade1') {
                    // Kelas 1: menjumlah hingga 20 (kurikulum: benda konkret hingga 20)
                    if (currentLevel === 'easy') { num1 = R(1, 5); num2 = R(1, 5); }
                    else if (currentLevel === 'medium') { num1 = R(1, 10); num2 = R(1, 10); }
                    else { num1 = R(5, 15); num2 = R(1, 5); }
                } else {
                    // Kelas 2: penjumlahan dua digit, dengan/tanpa menyimpan
                    if (currentLevel === 'easy') {
                        // Tanpa menyimpan dijamin: satuan1 + satuan2 <= 9
                        const ones1 = R(0, 9);
                        const ones2 = R(0, 9 - ones1);
                        num1 = R(1, 4) * 10 + ones1;
                        num2 = R(1, 4) * 10 + ones2;
                    } else if (currentLevel === 'medium') {
                        // Campuran alami, kadang menyimpan kadang tidak
                        num1 = R(10, 69); num2 = R(10, 69);
                    } else if (currentLevel === 'hard') {
                        // Dipaksa menyimpan: satuan1 + satuan2 >= 10
                        const ones1 = R(1, 9);
                        const ones2 = R(Math.max(1, 10 - ones1), 9);
                        num1 = R(1, 8) * 10 + ones1;
                        num2 = R(1, 8) * 10 + ones2;
                    } else {
                        // Mahir: angka jauh lebih besar (3 digit + 2 digit), tetap dipaksa menyimpan
                        const ones1 = R(1, 9);
                        const ones2 = R(Math.max(1, 10 - ones1), 9);
                        num1 = R(10, 89) * 10 + ones1;
                        num2 = R(1, 8) * 10 + ones2;
                    }
                }
                result = num1 + num2;
            }
            else if (activeOp === 'sub') {
                if (currentGrade === 'grade1') {
                    // Kelas 1: rentang sama seperti penjumlahan, num1 >= num2 supaya tidak negatif
                    let a, b;
                    if (currentLevel === 'easy') { a = R(1, 5); b = R(1, 5); }
                    else if (currentLevel === 'medium') { a = R(1, 10); b = R(1, 10); }
                    else { a = R(5, 15); b = R(1, 5); }
                    num1 = Math.max(a, b); num2 = Math.min(a, b);
                } else {
                    // Kelas 2: pengurangan dua digit, dengan/tanpa meminjam.
                    // Batas atas num1 dinaikkan bertahap per level: 19 -> 29 -> 50 -> bebas (Mahir).
                    if (currentLevel === 'easy') {
                        // num1 hingga 19, tanpa meminjam dijamin (satuan2 <= satuan1)
                        num1 = R(10, 19);
                        num2 = R(0, num1 % 10);
                    } else if (currentLevel === 'medium') {
                        // num1 hingga 29, campuran alami (kadang meminjam kadang tidak)
                        num1 = R(11, 29);
                        num2 = R(1, num1 - 1);
                    } else if (currentLevel === 'hard') {
                        // num1 hingga 50, dipaksa meminjam: satuan1 < satuan2, puluhan1 > puluhan2
                        const tens1 = R(1, 4);
                        const ones1 = R(0, 8);
                        const ones2 = R(ones1 + 1, 9);
                        const tens2 = R(0, tens1 - 1);
                        num1 = tens1 * 10 + ones1;
                        num2 = tens2 * 10 + ones2;
                    } else {
                        // Mahir: num1 jauh lebih besar (3 digit-ish), tetap dipaksa meminjam
                        const ones2 = R(1, 9);
                        const ones1 = R(0, ones2 - 1);
                        num1 = R(10, 89) * 10 + ones1;
                        num2 = R(1, 8) * 10 + ones2;
                    }
                }
                result = num1 - num2;
            }
            else if (activeOp === 'mul') {
                // Selalu Kelas 2 (perkalian belum diajarkan di Kelas 1)
                if (currentLevel === 'easy') { num2 = R(1, 5); num1 = R(1, 5); }
                else if (currentLevel === 'medium') { num2 = R(1, 5); num1 = R(1, 10); }
                else if (currentLevel === 'hard') { num2 = R(6, 10); num1 = R(1, 10); }
                else { num2 = R(6, 12); num1 = R(6, 12); } // Mahir: kedua faktor besar
                if (Math.random() > 0.5) { let temp = num1; num1 = num2; num2 = temp; }
                result = num1 * num2;
            }
            else if (activeOp === 'div') {
                // Dibalik dari perkalian (dividen = hasil kali) supaya hasil bagi
                // selalu bilangan bulat, dengan tingkat kesulitan mengikuti pola perkalian.
                let quotient, divisor;
                if (currentLevel === 'easy') { divisor = R(1, 5); quotient = R(1, 5); }
                else if (currentLevel === 'medium') { divisor = R(1, 5); quotient = R(1, 10); }
                else if (currentLevel === 'hard') { divisor = R(6, 10); quotient = R(1, 10); }
                else { divisor = R(6, 12); quotient = R(6, 12); } // Mahir
                num1 = quotient * divisor;
                num2 = divisor;
                result = quotient;
            }

            // Tentukan posisi tanda tanya: 0=kiri, 1=kanan, 2=hasil
            let qDisplay, trueAns;
            if (isFindMode) {
                const unknownPos = Math.floor(Math.random() * 3);
                if (unknownPos === 0) {
                    qDisplay = `? ${symbol} ${num2} = ${result}`;
                    trueAns = num1;
                } else if (unknownPos === 1) {
                    qDisplay = `${num1} ${symbol} ? = ${result}`;
                    trueAns = num2;
                } else {
                    qDisplay = `${num1} ${symbol} ${num2} = ?`;
                    trueAns = result;
                }
            } else {
                qDisplay = `${num1} ${symbol} ${num2} = ?`;
                trueAns = result;
            }

            currentQuestionData = {
                qDisplay: qDisplay,
                qText: `${num1} ${symbol} ${num2} = ${result}`,
                trueAns: trueAns,
                mistakes: 0,
                solved: false
            };

            document.getElementById('question').innerText = currentQuestionData.qDisplay;

            let answers = [trueAns];
            while (answers.length < 4) {
                let offset = Math.floor(Math.random() * 9) - 4;
                if (offset === 0) offset = 2;
                let wrongAnswer = trueAns + offset;
                if (wrongAnswer < 0) wrongAnswer = trueAns + 3;
                if (!answers.includes(wrongAnswer)) answers.push(wrongAnswer);
            }
            answers.sort(() => Math.random() - 0.5);

            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`opt${i}`);
                btn.innerText = answers[i];
                btn.value = answers[i];
                btn.style.backgroundColor = '#ffd166';
            }
        }

        function checkAnswer(index) {
            if (isProcessing) return;
            isProcessing = true;

            const selectedBtn = document.getElementById(`opt${index}`);
            const selectedAnswer = parseInt(selectedBtn.value);
            const feedbackEl = document.getElementById('feedback');

            const isCorrect = (selectedAnswer === currentQuestionData.trueAns);

            if (isCorrect) {
                currentQuestionData.solved = true;
                gameHistory.push({ ...currentQuestionData }); // Simpan state akhir soal

                playSfx('correct');
                feedbackEl.innerText = 'Benar! 🎉';
                feedbackEl.className = 'feedback correct';
                selectedBtn.style.backgroundColor = '#2ecc71';
                score += 10;

                confetti({ particleCount: 50, spread: 50, origin: { y: 0.8 } });
                document.getElementById('score').innerText = score;

                let delay = gameType === 'challenge' ? 600 : 1200;
                setTimeout(() => {
                    if(gameType === 'challenge' && timeLeft <= 0) return;
                    generateQuestion(); // Soal diganti hanya saat jawaban benar
                }, delay);

            } else {
                currentQuestionData.mistakes++; // Catat jumlah kesalahan

                playSfx('wrong');
                feedbackEl.innerText = 'Salah! 🤔';
                feedbackEl.className = 'feedback wrong';
                selectedBtn.style.backgroundColor = '#e74c3c';

                if (score > 0) score -= 5;
                document.getElementById('score').innerText = score;

                // Soal tidak diganti. Tombol di-reset agar anak bisa mencoba lagi
                setTimeout(() => {
                    selectedBtn.style.backgroundColor = '#ffd166';
                    feedbackEl.innerText = '';
                    feedbackEl.className = 'feedback';
                    isProcessing = false;
                }, 1000);
            }
        }

        function finishGame() {
            document.getElementById('final-score').innerText = score;
            const reviewContainer = document.getElementById('review-list');
            reviewContainer.innerHTML = '';

            if(gameHistory.length === 0) {
                reviewContainer.innerHTML = '<div class="review-item">Belum ada soal yang diselesaikan.</div>';
            } else {
                gameHistory.forEach(item => {
                    const div = document.createElement('div');

                    if (item.solved && item.mistakes === 0) {
                        div.className = 'review-item correct';
                        div.innerHTML = `<b>${item.qDisplay.replace('?', `<span style="background:#e67e22;color:white;border-radius:8px;padding:1px 8px;">${item.trueAns}</span>`)}</b><br><small style="color: #2ecc71;">✅ Sempurna</small>`;
                    } else if (item.solved && item.mistakes > 0) {
                        div.className = 'review-item warning';
                        div.innerHTML = `<b>${item.qDisplay.replace('?', `<span style="background:#e67e22;color:white;border-radius:8px;padding:1px 8px;">${item.trueAns}</span>`)}</b><br><small style="color: #d35400;">⚠️ Benar setelah salah ${item.mistakes} kali</small>`;
                    } else if (!item.solved) {
                        div.className = 'review-item wrong';
                        div.innerHTML = `<b>${item.qDisplay.replace('?', `<span style="background:#e67e22;color:white;border-radius:8px;padding:1px 8px;">${item.trueAns}</span>`)}</b><br><small style="color: #c0392b;">❌ Dihentikan (Sempat salah ${item.mistakes} kali)</small>`;
                    }

                    reviewContainer.appendChild(div);
                });
            }
            showScreen('screen-result');
        }
    </script>
</body>
</html>
