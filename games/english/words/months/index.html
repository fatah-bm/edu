<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Months of the Year</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .top-bar {
            display: flex;
            align-items: center;
            max-width: 560px;
            margin: 0 auto 10px auto;
        }
        .btn-back {
            background-color: #c7ceea;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #a0a8c8;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: #333;
        }
        .btn-back:active { transform: translateY(4px); box-shadow: none; }
        .btn-home {
            background-color: #ffd166;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #ccaa33;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: #333;
        }
        .btn-home:active { transform: translateY(4px); box-shadow: none; }
        h1 { color: #ff6b6b; font-size: 28px; margin: 0; flex: 1; }
        .subtitle { color: #777; font-size: 15px; margin: 0 0 16px 0; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 560px;
            margin: 0 auto;
        }
        .card {
            background-color: white;
            border-radius: 14px;
            padding: 12px 6px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .card:active { transform: translateY(5px); box-shadow: none !important; }
        .card.playing { opacity: 0.75; }
        .badge {
            display: block;
            width: 60px;
            height: 60px;
            border-radius: 14px;
            margin: 0 auto 8px auto;
            line-height: 60px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            letter-spacing: 0.5px;
        }
        .card p { font-size: 14px; font-weight: bold; color: #2c3e50; margin: 0; }
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            max-width: 560px;
            margin: 20px auto 0 auto;
        }
        .btn-page {
            background-color: #4ecdc4;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 22px;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #36b2aa;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-page:active { transform: translateY(4px); box-shadow: none; }
        .btn-page:disabled { background-color: #ccc; box-shadow: 0 4px 0 #aaa; cursor: default; }
        .page-indicator { font-size: 16px; color: #555; font-weight: bold; min-width: 80px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="btn-back" href="../">⬅ Back</a>
        <h1>Months of the Year</h1>
        <a class="btn-home" href="../../../../">Home</a>
    </div>
    <p class="subtitle">How to pronounce these months? Tap a card!</p>

    <div class="grid" id="grid"></div>

    <div class="pagination">
        <button class="btn-page" id="btn-prev" onclick="changePage(-1)">◀</button>
        <span class="page-indicator" id="page-indicator"></span>
        <button class="btn-page" id="btn-next" onclick="changePage(1)">▶</button>
    </div>

    <script>
        const months = [
            { word: 'January',   abbr: 'JAN', color: '#74b9ff', shadow: '#4a90d9' },
            { word: 'February',  abbr: 'FEB', color: '#a29bfe', shadow: '#7c6fd4' },
            { word: 'March',     abbr: 'MAR', color: '#55efc4', shadow: '#38c9a0' },
            { word: 'April',     abbr: 'APR', color: '#81ecec', shadow: '#55c9c9' },
            { word: 'May',       abbr: 'MAY', color: '#2ecc71', shadow: '#27ae60' },
            { word: 'June',      abbr: 'JUN', color: '#ffd166', shadow: '#ccaa33' },
            { word: 'July',      abbr: 'JUL', color: '#ff9f43', shadow: '#cc7a1f' },
            { word: 'August',    abbr: 'AUG', color: '#ff6b6b', shadow: '#cc4444' },
            { word: 'September', abbr: 'SEP', color: '#e17055', shadow: '#b54e37' },
            { word: 'October',   abbr: 'OCT', color: '#d35400', shadow: '#a84300' },
            { word: 'November',  abbr: 'NOV', color: '#636e72', shadow: '#4a5254' },
            { word: 'December',  abbr: 'DEC', color: '#74b9ff', shadow: '#4a90d9' },
        ];

        const PER_PAGE = 6;
        let currentPage = 0;
        const totalPages = Math.ceil(months.length / PER_PAGE);

        function renderPage() {
            const grid = document.getElementById('grid');
            const pageItems = months.slice(currentPage * PER_PAGE, (currentPage + 1) * PER_PAGE);

            grid.innerHTML = pageItems.map(m => `
                <div class="card" data-word="${m.word}"
                     style="border: 3px solid ${m.color}; box-shadow: 0 5px 0 ${m.shadow};">
                    <span class="badge" style="background-color: ${m.color};">${m.abbr}</span>
                    <p>${m.word}</p>
                </div>
            `).join('');

            grid.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', () => speak(card.dataset.word, card));
            });

            document.getElementById('page-indicator').textContent = `${currentPage + 1} / ${totalPages}`;
            document.getElementById('btn-prev').disabled = currentPage === 0;
            document.getElementById('btn-next').disabled = currentPage === totalPages - 1;
        }

        function changePage(dir) {
            currentPage += dir;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function speak(word, card) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 1.2;
            card.classList.add('playing');
            utterance.onend = () => card.classList.remove('playing');
            utterance.onerror = () => card.classList.remove('playing');
            window.speechSynthesis.speak(utterance);
        }

        renderPage();
    </script>
</body>
</html>
