<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color</title>
    <link rel="stylesheet" href="../../../../assets/shared.css">
    <style>
        .subtitle {
            color: #777;
            font-size: 15px;
            margin: 0 0 16px 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 560px;
            margin: 0 auto;
        }
        .sprite {
            width: 64px;
            height: 64px;
            background-image: url('../../../../assets/color.png');
            background-size: 256px 128px;
            display: block;
            margin: 0 auto 8px auto;
        }
        .card p {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }
    </style>
</head>
<body data-theme="english">
    <div id="topbar"></div>
    <script src="../../../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'Color', backHref: '../', homeHref: '../../../../', audio: true });
    </script>
    <p class="subtitle">How to pronounce these words? Tap a card!</p>

    <div class="grid" id="grid"></div>

    <script>
        const words = [
            { word: 'red',    meaning: 'merah' },
            { word: 'orange', meaning: 'oranye' },
            { word: 'green',  meaning: 'hijau' },
            { word: 'yellow', meaning: 'kuning' },
            { word: 'blue',   meaning: 'biru' },
            { word: 'purple', meaning: 'ungu' },
            { word: 'black',  meaning: 'hitam' },
            { word: 'white',  meaning: 'putih' },
        ];

        const SHEET_COLS = 4;
        const grid = document.getElementById('grid');

        grid.innerHTML = words.map((item, idx) => {
            const bx = (idx % SHEET_COLS) * 64;
            const by = Math.floor(idx / SHEET_COLS) * 64;
            return `
            <div class="card card--leaf" data-word="${item.word}">
                <div class="sprite" style="background-position: -${bx}px -${by}px;"></div>
                <p>${item.word.charAt(0).toUpperCase() + item.word.slice(1)}</p>
                <small>${item.meaning}</small>
            </div>`;
        }).join('');

        grid.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', () => speak(card.dataset.word, card));
        });

        function speak(word, card) {
            if (!isAudioEnabled) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 1.2;
            card.classList.add('playing');
            utterance.onend = () => card.classList.remove('playing');
            utterance.onerror = () => card.classList.remove('playing');
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
