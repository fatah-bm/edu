<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Singular & Plural</title>
    <link rel="stylesheet" href="../../../../assets/shared.css">
    <style>
        .subtitle { color: #777; font-size: 14px; margin: 0 0 12px 0; }

        .col-headers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-width: 560px;
            margin: 0 auto 8px auto;
        }
        .col-label {
            border-radius: 10px;
            padding: 6px;
            font-size: 14px;
            font-weight: bold;
            color: white;
        }
        .col-label.singular { background-color: #3498db; }
        .col-label.plural   { background-color: #9b59b6; }

        .pairs { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

        .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .single-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            display: block;
            margin: 0 auto 6px auto;
        }
        .multi-imgs {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 6px;
        }
        .multi-imgs img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }
        .img-placeholder {
            background: #eee;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #bbb;
            font-size: 10px;
            margin: 0 auto 6px auto;
        }
        .card p {
            font-size: 14px;
            word-break: break-word;
        }
        .ending {
            background-color: #ffd166;
            color: #b35c00;
            border-radius: 4px;
            padding: 0 3px;
        }
    </style>
</head>
<body data-theme="english">
    <div id="topbar"></div>
    <script src="../../../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'Singular & Plural', backHref: '../', homeHref: '../../../../', audio: true });
    </script>
    <p class="subtitle">Tap a word to hear it!</p>

    <div class="col-headers">
        <div class="col-label singular">One (Singular)</div>
        <div class="col-label plural">Many (Plural)</div>
    </div>

    <div class="pairs" id="pairs"></div>

    <div class="pagination">
        <button class="btn-page" id="btn-prev" onclick="changePage(-1)">◀</button>
        <span class="page-indicator" id="page-indicator"></span>
        <button class="btn-page" id="btn-next" onclick="changePage(1)">▶</button>
    </div>

    <script>
        const items = [
            { singular: 'onion',      plural: 'onions',       base: 'onion',     ending: 's',   emoji: '🧅', img: 'https://img.icons8.com/color/96/onion.png',      meaning: 'bawang',  meaningPlural: 'bawang-bawang' },
            { singular: 'strawberry', plural: 'strawberries', base: 'strawberr', ending: 'ies', emoji: '🍓', img: 'https://img.icons8.com/color/96/strawberry.png', meaning: 'stroberi', meaningPlural: 'stroberi-stroberi' },
            { singular: 'tomato',     plural: 'tomatoes',     base: 'tomato',    ending: 'es',  emoji: '🍅', img: 'https://img.icons8.com/color/96/tomato.png',     meaning: 'tomat',   meaningPlural: 'tomat-tomat' },
            { singular: 'carrot',     plural: 'carrots',      base: 'carrot',    ending: 's',   emoji: '🥕', img: 'https://img.icons8.com/color/96/carrot.png',     meaning: 'wortel',  meaningPlural: 'wortel-wortel' },
            { singular: 'cabbage',    plural: 'cabbages',     base: 'cabbage',   ending: 's',   emoji: '🥬', img: 'https://img.icons8.com/color/96/cabbage.png',    meaning: 'kubis',   meaningPlural: 'kubis-kubis' },
            { singular: 'broccoli',   plural: 'broccolis',    base: 'broccoli',  ending: 's',   emoji: '🥦', img: 'https://img.icons8.com/color/96/broccoli.png',   meaning: 'brokoli', meaningPlural: 'brokoli-brokoli' },
            { singular: 'donut',      plural: 'donuts',       base: 'donut',     ending: 's',   emoji: '🍩', img: 'https://img.icons8.com/color/96/donut.png',      meaning: 'donat',   meaningPlural: 'donat-donat' },
            { singular: 'leaf',       plural: 'leaves',       base: 'lea',       ending: 'ves', emoji: '🍃', img: 'https://img.icons8.com/color/96/leaf.png',       meaning: 'daun',    meaningPlural: 'daun-daun' },
            { singular: 'knife',      plural: 'knives',       base: 'kni',       ending: 'ves', emoji: '🔪', img: 'https://img.icons8.com/color/96/knife.png',      meaning: 'pisau',   meaningPlural: 'pisau-pisau' },
            { singular: 'book',       plural: 'books',        base: 'book',      ending: 's',   emoji: '📖', img: 'https://img.icons8.com/color/96/book.png',       meaning: 'buku',    meaningPlural: 'buku-buku' },
            { singular: 'pen',        plural: 'pens',         base: 'pen',       ending: 's',   emoji: '🖊️', img: 'https://img.icons8.com/color/96/pen.png',        meaning: 'pena',    meaningPlural: 'pena-pena' },
            { singular: 'pencil',     plural: 'pencils',      base: 'pencil',    ending: 's',   emoji: '✏️', img: 'https://img.icons8.com/color/96/pencil.png',     meaning: 'pensil',  meaningPlural: 'pensil-pensil' },
            { singular: 'toy',        plural: 'toys',         base: 'toy',       ending: 's',   emoji: '🧸', img: 'https://img.icons8.com/color/96/toy.png',        meaning: 'mainan',  meaningPlural: 'mainan-mainan' },
        ];

        const PER_PAGE = 3;
        let currentPage = 0;
        const totalPages = Math.ceil(items.length / PER_PAGE);

        function imgTag(src, emoji, cls) {
            const sz = cls === 'single-img' ? 52 : 34;
            return `<img class="${cls}" src="${src}" alt="${cls}"
                        onerror="this.outerHTML='<span style=\\'font-size:${sz}px;display:block;text-align:center\\'>${emoji}</span>'">`;
        }

        function renderPage() {
            const pairs = document.getElementById('pairs');
            const pageItems = items.slice(currentPage * PER_PAGE, (currentPage + 1) * PER_PAGE);

            pairs.innerHTML = pageItems.map(item => `
                <div class="pair">
                    <div class="card card--leaf singular" data-word="${item.singular}">
                        ${imgTag(item.img, item.emoji, 'single-img')}
                        <p>${item.singular}</p>
                        <small>${item.meaning}</small>
                    </div>
                    <div class="card card--leaf plural" data-word="${item.plural}" data-singular="${item.singular}">
                        <div class="multi-imgs">
                            ${imgTag(item.img, item.emoji, 'multi-img')}
                            ${imgTag(item.img, item.emoji, 'multi-img')}
                        </div>
                        <p>${item.base}<span class="ending">${item.ending}</span></p>
                        <small>${item.meaningPlural}</small>
                    </div>
                </div>
            `).join('');

            pairs.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', () => {
                    if (card.classList.contains('plural')) {
                        speakPlural(card.dataset.singular, card.dataset.word, card);
                    } else {
                        speakWord(card.dataset.word, card);
                    }
                });
            });

            document.getElementById('page-indicator').textContent = `${currentPage + 1} / ${totalPages}`;
            document.getElementById('btn-prev').disabled = currentPage === 0;
            document.getElementById('btn-next').disabled = currentPage === totalPages - 1;
        }

        function changePage(dir) {
            currentPage += dir;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function speakWord(word, card, rate = 0.85) {
            if (!isAudioEnabled) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(word);
            u.lang = 'en-US';
            u.rate = rate;
            u.pitch = 1.2;
            card.classList.add('playing');
            u.onend = () => card.classList.remove('playing');
            u.onerror = () => card.classList.remove('playing');
            window.speechSynthesis.speak(u);
        }

        function speakPlural(singular, plural, card) {
            speakWord(plural, card, 0.85);
        }

        renderPage();
    </script>
</body>
</html>
