<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Numbers 1–20</title>
    <link rel="stylesheet" href="../../../../assets/shared.css">
    <style>
        .subtitle {
            color: #777;
            font-size: 15px;
            margin: 0 0 16px 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 560px;
            margin: 0 auto;
        }
        .card .num {
            font-size: 36px;
            font-weight: bold;
            color: #ff6b6b;
            display: block;
            line-height: 1;
            margin-bottom: 6px;
        }
        .card p {
            font-size: 12px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }
    </style>
</head>
<body data-theme="english">
    <div id="topbar"></div>
    <script src="../../../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'Numbers 1–20', backHref: '../', homeHref: '../../../../', audio: true });
    </script>
    <p class="subtitle">How to pronounce these numbers? Tap a card!</p>

    <div class="grid" id="grid"></div>

    <div class="pagination">
        <button class="btn-page" id="btn-prev" onclick="changePage(-1)">◀</button>
        <span class="page-indicator" id="page-indicator"></span>
        <button class="btn-page" id="btn-next" onclick="changePage(1)">▶</button>
    </div>

    <script>
        const numbers = [
            { n: 1,  word: 'one' },
            { n: 2,  word: 'two' },
            { n: 3,  word: 'three' },
            { n: 4,  word: 'four' },
            { n: 5,  word: 'five' },
            { n: 6,  word: 'six' },
            { n: 7,  word: 'seven' },
            { n: 8,  word: 'eight' },
            { n: 9,  word: 'nine' },
            { n: 10, word: 'ten' },
            { n: 11, word: 'eleven' },
            { n: 12, word: 'twelve' },
            { n: 13, word: 'thirteen' },
            { n: 14, word: 'fourteen' },
            { n: 15, word: 'fifteen' },
            { n: 16, word: 'sixteen' },
            { n: 17, word: 'seventeen' },
            { n: 18, word: 'eighteen' },
            { n: 19, word: 'nineteen' },
            { n: 20, word: 'twenty' },
        ];

        const PER_PAGE = 10;
        let currentPage = 0;
        const totalPages = Math.ceil(numbers.length / PER_PAGE);

        function renderPage() {
            const grid = document.getElementById('grid');
            const pageItems = numbers.slice(currentPage * PER_PAGE, (currentPage + 1) * PER_PAGE);

            grid.innerHTML = pageItems.map(item => `
                <div class="card card--leaf" data-word="${item.word}">
                    <span class="num">${item.n}</span>
                    <p>${item.word}</p>
                </div>
            `).join('');

            grid.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', () => speak(card.dataset.word, card));
            });

            document.getElementById('page-indicator').textContent = `${currentPage + 1} / ${totalPages}`;
            document.getElementById('btn-prev').disabled = currentPage === 0;
            document.getElementById('btn-next').disabled = currentPage === totalPages - 1;
        }

        function changePage(dir) {
            currentPage += dir;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function speak(word, card) {
            if (!isAudioEnabled) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 1.2;
            card.classList.add('playing');
            utterance.onend = () => card.classList.remove('playing');
            utterance.onerror = () => card.classList.remove('playing');
            window.speechSynthesis.speak(utterance);
        }

        renderPage();
    </script>
</body>
</html>
