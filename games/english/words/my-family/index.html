<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Family</title>
    <link rel="stylesheet" href="../../../../assets/shared.css">
    <style>
        .subtitle {
            color: #777;
            font-size: 15px;
            margin: 0 0 16px 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 560px;
            margin: 0 auto;
        }
        .card img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            display: block;
            margin: 0 auto 8px auto;
        }
        .card .placeholder {
            width: 64px;
            height: 64px;
            background-color: #eee;
            border-radius: 10px;
            margin: 0 auto 8px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 11px;
        }
        .card p {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }
    </style>
</head>
<body data-theme="english">
    <div id="topbar"></div>
    <script src="../../../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'My Family', backHref: '../', homeHref: '../../../../', audio: true });
    </script>
    <p class="subtitle">How to pronounce these words? Tap a card!</p>

    <div class="grid" id="grid"></div>

    <div class="pagination">
        <button class="btn-page" id="btn-prev" onclick="changePage(-1)">◀</button>
        <span class="page-indicator" id="page-indicator"></span>
        <button class="btn-page" id="btn-next" onclick="changePage(1)">▶</button>
    </div>

    <script>
        const words = [
            { word: 'father',      meaning: 'ayah',              emoji: '👨', img: 'https://img.icons8.com/color/96/father.png' },
            { word: 'mother',      meaning: 'ibu',               emoji: '👩', img: 'https://img.icons8.com/color/96/mother.png' },
            { word: 'brother',     meaning: 'saudara laki-laki', emoji: '👦', img: 'https://img.icons8.com/color/96/brother.png' },
            { word: 'sister',      meaning: 'saudara perempuan', emoji: '👧', img: 'https://img.icons8.com/color/96/sister.png' },
            { word: 'grandfather', meaning: 'kakek',             emoji: '👴', img: 'https://img.icons8.com/color/96/grandfather.png' },
            { word: 'grandmother', meaning: 'nenek',             emoji: '👵', img: 'https://img.icons8.com/color/96/grandmother.png' },
            { word: 'baby',        meaning: 'bayi',              emoji: '👶', img: 'https://img.icons8.com/color/96/baby.png' },
            { word: 'son',         meaning: 'anak laki-laki',    emoji: '👦', img: 'https://img.icons8.com/color/96/boy.png' },
            { word: 'daughter',    meaning: 'anak perempuan',    emoji: '👧', img: 'https://img.icons8.com/color/96/girl.png' },
        ];

        const PER_PAGE = 6;
        let currentPage = 0;
        const totalPages = Math.ceil(words.length / PER_PAGE);

        function renderPage() {
            const grid = document.getElementById('grid');
            const pageWords = words.slice(currentPage * PER_PAGE, (currentPage + 1) * PER_PAGE);

            grid.innerHTML = pageWords.map(item => `
                <div class="card card--leaf" data-word="${item.word}">
                    <img src="${item.img}" alt="${item.word}"
                         onerror="this.outerHTML='<span style=\\'font-size:52px;display:block;text-align:center;margin:0 auto 8px\\'>${item.emoji}</span>'">
                    <p>${item.word.charAt(0).toUpperCase() + item.word.slice(1)}</p>
                    <small>${item.meaning}</small>
                </div>
            `).join('');

            grid.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', () => speak(card.dataset.word, card));
            });

            document.getElementById('page-indicator').textContent = `${currentPage + 1} / ${totalPages}`;
            document.getElementById('btn-prev').disabled = currentPage === 0;
            document.getElementById('btn-next').disabled = currentPage === totalPages - 1;
        }

        function changePage(dir) {
            currentPage += dir;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function speak(word, card) {
            if (!isAudioEnabled) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 1.2;
            card.classList.add('playing');
            utterance.onend = () => card.classList.remove('playing');
            utterance.onerror = () => card.classList.remove('playing');
            window.speechSynthesis.speak(utterance);
        }

        renderPage();
    </script>
</body>
</html>
