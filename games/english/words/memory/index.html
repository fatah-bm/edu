<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Game</title>
    <link rel="stylesheet" href="../../../../assets/shared.css">
    <style>
        body { user-select: none; -webkit-user-select: none; }

        .box {
            background: white; border-radius: 20px; padding: 20px;
            max-width: 500px; margin: 0 auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 4px solid #9b59b6;
        }
        .box h2 { color: #555; margin-top: 0; font-size: 20px; }

        .topic-btn {
            display: block; width: 100%; padding: 14px; margin: 10px 0;
            font-family: inherit; font-size: 20px; font-weight: bold;
            border: none; border-radius: 14px; cursor: pointer; color: white;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .topic-btn:active { transform: translateY(5px); box-shadow: none; }

        .scoreboard {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; font-size: 16px; color: #555;
            border-bottom: 2px dashed #eee; padding-bottom: 10px;
            flex-wrap: wrap; gap: 6px;
        }
        .badge { background: #eee; padding: 4px 10px; border-radius: 10px; font-size: 14px; }
        .badge-timer { background: #ffeaa7; color: #d35400; font-weight: bold; }
        .badge-pairs { background: #e8daef; color: #7d3c98; font-weight: bold; }

        .mem-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 0 auto;
        }
        .mem-card {
            aspect-ratio: 1;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            transition: transform 0.12s;
        }
        .mem-card:active { transform: scale(0.93); }

        .mem-back, .mem-front {
            position: absolute; inset: 0;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .mem-back {
            background: #9b59b6;
            color: white; font-size: 26px; font-weight: bold;
            border: 3px solid #7d3c98;
        }
        .mem-front {
            display: none; background: white;
            border: 3px solid #9b59b6;
            flex-direction: column; padding: 4px;
        }
        .mem-card.revealed .mem-back { display: none; }
        .mem-card.revealed .mem-front { display: flex; }
        .mem-card.matched .mem-front { border-color: #2ecc71; background: #eafaf1; }

        .card-emoji { font-size: 38px; line-height: 1; }
        .card-badge {
            width: 50px; height: 50px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; color: white; letter-spacing: 0.5px;
        }
        .card-sprite {
            width: 56px; height: 56px;
            background-repeat: no-repeat;
        }
        .card-img { width: 54px; height: 54px; object-fit: contain; }
        .card-word {
            font-size: 12px; font-weight: bold; color: #2c3e50;
            word-break: break-word; line-height: 1.2; text-align: center;
        }

        .btn-stop {
            display: block; width: 100%; padding: 12px; margin-top: 14px;
            font-family: inherit; font-size: 16px; font-weight: bold;
            border: none; border-radius: 14px; cursor: pointer;
            background: #c7ceea; color: #333; box-shadow: 0 4px 0 #a0a8c8;
            touch-action: manipulation;
        }
        .btn-stop:active { transform: translateY(4px); box-shadow: none; }

        .result-score { font-size: 52px; font-weight: bold; color: #f39c12; margin: 8px 0; }
        .result-detail { font-size: 17px; color: #666; margin: 6px 0; }
        .btn-again-topic {
            display: block; width: 100%; padding: 14px; margin-top: 16px;
            font-family: inherit; font-size: 20px; font-weight: bold;
            border: none; border-radius: 14px; cursor: pointer;
            background: #9b59b6; color: white; box-shadow: 0 5px 0 #7d3c98;
            touch-action: manipulation;
        }
        .btn-again-topic:active { transform: translateY(5px); box-shadow: none; }
    </style>
</head>
<body data-theme="english">
    <div id="topbar"></div>
    <script src="../../../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'Memory Game', backHref: '../', homeHref: '../../../../', audio: true });
    </script>

    <div class="box" id="screen-topic">
        <h2>Pilih Topik:</h2>
        <button class="topic-btn" style="background:#ff6b6b; box-shadow:0 5px 0 #c0392b;" onclick="selectTopic('body')">🏃 My Body</button>
        <button class="topic-btn" style="background:#e67e22; box-shadow:0 5px 0 #ca6f1e;" onclick="selectTopic('family')">👪 My Family</button>
        <button class="topic-btn" style="background:#3498db; box-shadow:0 5px 0 #2176ae;" onclick="selectTopic('days')">📅 Days</button>
        <button class="topic-btn" style="background:#9b59b6; box-shadow:0 5px 0 #7d3c98;" onclick="selectTopic('months')">📆 Months</button>
        <button class="topic-btn" style="background:#16a085; box-shadow:0 5px 0 #0e6655;" onclick="selectTopic('adjective')">📏 Adjective</button>
        <button class="topic-btn" style="background:#e84393; box-shadow:0 5px 0 #c2185b;" onclick="selectTopic('color')">🎨 Color</button>
        <button class="topic-btn" style="background:#f39c12; box-shadow:0 5px 0 #c87f0a;" onclick="selectTopic('animal')">🦁 Animal</button>
        <button class="topic-btn" style="background:#2980b9; box-shadow:0 5px 0 #1f618d;" onclick="selectTopic('facilities')">🏢 Public Facilities</button>
        <button class="topic-btn" style="background:#795548; box-shadow:0 5px 0 #5d4037;" onclick="selectTopic('house')">🏠 My House</button>
        <button class="topic-btn" style="background:#2c3e50; box-shadow:0 5px 0 #1a252f;" onclick="selectTopic('mixed')">🎲 Mixed</button>
    </div>

    <div class="box" id="screen-game" style="display:none;">
        <div class="scoreboard">
            <span class="badge" id="topic-badge">-</span>
            <span class="badge badge-timer">⏱️ <span id="time-left">120</span>s</span>
            <span class="badge badge-pairs">🃏 <span id="pairs-found">0</span>/<span id="pairs-total">8</span></span>
            <span>Skor: <strong id="score">0</strong></span>
        </div>
        <div class="mem-grid" id="mem-grid"></div>
        <button class="btn-stop" onclick="stopGame()">⏹️ Selesai & Lihat Hasil</button>
    </div>

    <div class="box" id="screen-result" style="display:none;">
        <h2 id="result-title">Waktu Habis! ⏰</h2>
        <div class="result-score" id="final-score">0</div>
        <div class="result-detail" id="final-pairs">Pasangan ditemukan: 0</div>
        <button class="btn-again-topic" onclick="showScreen('screen-topic')">🔄 Pilih Topik Lagi</button>
    </div>

    <script>
        const TOPICS = {
            body: {
                label: 'My Body', cardType: 'sprite',
                sheet: '../../../../assets/my-body.png', cols: 5, rows: 4,
                items: [
                    { word: 'head',      idx: 0  }, { word: 'hair',      idx: 1  },
                    { word: 'eyes',      idx: 2  }, { word: 'ears',      idx: 3  },
                    { word: 'nose',      idx: 4  }, { word: 'mouth',     idx: 5  },
                    { word: 'cheek',     idx: 6  }, { word: 'chin',      idx: 7  },
                    { word: 'neck',      idx: 8  }, { word: 'shoulders', idx: 9  },
                    { word: 'elbow',     idx: 10 }, { word: 'fingers',   idx: 11 },
                    { word: 'hands',     idx: 12 }, { word: 'stomach',   idx: 13 },
                    { word: 'knees',     idx: 14 }, { word: 'legs',      idx: 15 },
                    { word: 'toes',      idx: 16 }, { word: 'feet',      idx: 17 },
                    { word: 'foot',      idx: 18 },
                ]
            },
            family: {
                label: 'My Family', cardType: 'img',
                items: [
                    { word: 'father',      v: 'https://img.icons8.com/color/96/father.png',      emoji: '👨' },
                    { word: 'mother',      v: 'https://img.icons8.com/color/96/mother.png',      emoji: '👩' },
                    { word: 'brother',     v: 'https://img.icons8.com/color/96/brother.png',     emoji: '👦' },
                    { word: 'sister',      v: 'https://img.icons8.com/color/96/sister.png',      emoji: '👧' },
                    { word: 'grandfather', v: 'https://img.icons8.com/color/96/grandfather.png', emoji: '👴' },
                    { word: 'grandmother', v: 'https://img.icons8.com/color/96/grandmother.png', emoji: '👵' },
                    { word: 'baby',        v: 'https://img.icons8.com/color/96/baby.png',        emoji: '👶' },
                    { word: 'son',         v: 'https://img.icons8.com/color/96/boy.png',         emoji: '🧒' },
                    { word: 'daughter',    v: 'https://img.icons8.com/color/96/girl.png',        emoji: '👧' },
                ]
            },
            days: {
                label: 'Days', cardType: 'badge',
                items: [
                    { word: 'Sunday',    v: 'SUN', color: '#ff6b6b' },
                    { word: 'Monday',    v: 'MON', color: '#ffa552' },
                    { word: 'Tuesday',   v: 'TUE', color: '#f1c40f' },
                    { word: 'Wednesday', v: 'WED', color: '#2ecc71' },
                    { word: 'Thursday',  v: 'THU', color: '#4ecdc4' },
                    { word: 'Friday',    v: 'FRI', color: '#3498db' },
                    { word: 'Saturday',  v: 'SAT', color: '#9b59b6' },
                ]
            },
            months: {
                label: 'Months', cardType: 'badge',
                items: [
                    { word: 'January',   v: 'JAN', color: '#74b9ff' },
                    { word: 'February',  v: 'FEB', color: '#a29bfe' },
                    { word: 'March',     v: 'MAR', color: '#00b894' },
                    { word: 'April',     v: 'APR', color: '#81ecec' },
                    { word: 'May',       v: 'MAY', color: '#2ecc71' },
                    { word: 'June',      v: 'JUN', color: '#f1c40f' },
                    { word: 'July',      v: 'JUL', color: '#ff9f43' },
                    { word: 'August',    v: 'AUG', color: '#ff6b6b' },
                    { word: 'September', v: 'SEP', color: '#e17055' },
                    { word: 'October',   v: 'OCT', color: '#d35400' },
                    { word: 'November',  v: 'NOV', color: '#636e72' },
                    { word: 'December',  v: 'DEC', color: '#0984e3' },
                ]
            },
            adjective: {
                label: 'Adjective', cardType: 'sprite',
                sheet: '../../../../assets/adjective.png', cols: 5, rows: 3,
                items: [
                    { word: 'big', idx: 0 }, { word: 'small', idx: 1 }, { word: 'tall', idx: 2 },
                    { word: 'short', idx: 3 }, { word: 'long', idx: 4 }, { word: 'large', idx: 5 },
                    { word: 'thin', idx: 6 }, { word: 'fat', idx: 7 }, { word: 'slow', idx: 8 },
                    { word: 'high', idx: 9 }, { word: 'low', idx: 10 }, { word: 'pretty', idx: 11 },
                    { word: 'cute', idx: 12 }, { word: 'handsome', idx: 13 },
                ]
            },
            color: {
                label: 'Color', cardType: 'sprite',
                sheet: '../../../../assets/color.png', cols: 4, rows: 2,
                items: [
                    { word: 'red', idx: 0 }, { word: 'orange', idx: 1 }, { word: 'green', idx: 2 },
                    { word: 'yellow', idx: 3 }, { word: 'blue', idx: 4 }, { word: 'purple', idx: 5 },
                    { word: 'black', idx: 6 }, { word: 'white', idx: 7 },
                ]
            },
            animal: {
                label: 'Animal', cardType: 'sprite',
                sheet: '../../../../assets/animal.png', cols: 5, rows: 3,
                items: [
                    { word: 'monkey', idx: 0 }, { word: 'dolphin', idx: 1 }, { word: 'tiger', idx: 2 },
                    { word: 'rhinoceros', idx: 3 }, { word: 'orangutan', idx: 4 }, { word: 'lion', idx: 5 },
                    { word: 'kangaroo', idx: 6 }, { word: 'bear', idx: 7 }, { word: 'penguin', idx: 8 },
                    { word: 'peacock', idx: 9 }, { word: 'zebra', idx: 10 }, { word: 'wolf', idx: 11 },
                    { word: 'elephant', idx: 12 }, { word: 'giraffe', idx: 13 }, { word: 'whale', idx: 14 },
                ]
            },
            facilities: {
                label: 'Public Facilities', cardType: 'sprite',
                sheet: '../../../../assets/public-facilities.png', cols: 5, rows: 3,
                items: [
                    { word: 'mosque', idx: 0 }, { word: 'airport', idx: 1 }, { word: 'bank', idx: 2 },
                    { word: 'market', idx: 3 }, { word: 'supermarket', idx: 4 }, { word: 'school', idx: 5 },
                    { word: 'hospital', idx: 6 }, { word: 'post office', idx: 7 }, { word: 'police office', idx: 8 },
                    { word: 'restaurant', idx: 9 }, { word: 'hotel', idx: 10 }, { word: 'library', idx: 11 },
                    { word: 'train station', idx: 12 }, { word: 'bus station', idx: 13 },
                ]
            },
            house: {
                label: 'My House', cardType: 'sprite',
                sheet: '../../../../assets/my-house.png', cols: 5, rows: 4,
                items: [
                    { word: 'door', idx: 0 }, { word: 'window', idx: 1 }, { word: 'floor', idx: 2 },
                    { word: 'gate', idx: 3 }, { word: 'roof', idx: 4 }, { word: 'garage', idx: 5 },
                    { word: 'wall', idx: 6 }, { word: 'porch', idx: 7 }, { word: 'stairs', idx: 8 },
                    { word: 'garden', idx: 9 }, { word: 'chimney', idx: 10 }, { word: 'living room', idx: 11 },
                    { word: 'dining room', idx: 12 }, { word: 'bedroom', idx: 13 }, { word: 'bathroom', idx: 14 },
                    { word: 'kitchen', idx: 15 }, { word: 'fireplace', idx: 16 },
                ]
            }
        };
        const TOPIC_KEYS = ['body', 'family', 'days', 'months', 'adjective', 'color', 'animal', 'facilities', 'house'];
        const MIXED_PAIRS = 8;

        let flipped       = [];
        let matchedCount  = 0;
        let totalPairs    = 0;
        let isChecking    = false;
        let score         = 0;
        let timeLeft      = 120;
        let timerInterval = null;

        function showScreen(id) {
            ['screen-topic','screen-game','screen-result'].forEach(s =>
                document.getElementById(s).style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        function selectTopic(key) {
            score = 0; matchedCount = 0; flipped = []; isChecking = false;
            document.getElementById('score').innerText = 0;
            document.getElementById('topic-badge').innerText =
                key === 'mixed' ? '🎲 Mixed' : TOPICS[key].label;
            showScreen('screen-game');

            // Build item pool
            let selectedItems;
            if (key === 'mixed') {
                // Random items pooled from every topic, capped at MIXED_PAIRS pairs
                let allItems = [];
                TOPIC_KEYS.forEach(tk => {
                    TOPICS[tk].items.forEach(item => allItems.push({ ...item, topicKey: tk }));
                });
                allItems.sort(() => Math.random() - 0.5);
                selectedItems = allItems.slice(0, MIXED_PAIRS);
            } else {
                const pool = [...TOPICS[key].items].sort(() => Math.random() - 0.5);
                const n = Math.min(8, pool.length);
                selectedItems = pool.slice(0, n).map(item => ({ ...item, topicKey: key }));
            }

            totalPairs = selectedItems.length;
            document.getElementById('pairs-total').innerText = totalPairs;
            document.getElementById('pairs-found').innerText = 0;

            let cards = [];
            selectedItems.forEach((item, i) => {
                cards.push({ pairId: i, type: 'visual', item, topicKey: item.topicKey });
                cards.push({ pairId: i, type: 'word',   item, topicKey: item.topicKey });
            });
            cards.sort(() => Math.random() - 0.5);

            document.getElementById('mem-grid').innerHTML = cards.map(c => `
                <div class="mem-card" data-pair="${c.pairId}" data-type="${c.type}"
                     data-word="${c.item.word}" onclick="flipCard(this)">
                    <div class="mem-back">?</div>
                    <div class="mem-front">${renderFront(c)}</div>
                </div>`).join('');

            startTimer();
        }

        function renderFront(card) {
            if (card.type === 'word') {
                const w = card.item.word;
                return `<span class="card-word">${w.charAt(0).toUpperCase() + w.slice(1)}</span>`;
            }
            const topic = TOPICS[card.topicKey];
            switch (topic.cardType) {
                case 'sprite': {
                    const bx = (card.item.idx % topic.cols) * 56;
                    const by = Math.floor(card.item.idx / topic.cols) * 56;
                    return `<div class="card-sprite" style="background-image:url('${topic.sheet}'); background-size:${topic.cols * 56}px ${topic.rows * 56}px; background-position:-${bx}px -${by}px;"></div>`;
                }
                case 'img':
                    return `<img class="card-img" src="${card.item.v}" alt="${card.item.word}" onerror="this.outerHTML='<span class=\\'card-emoji\\'>${card.item.emoji}</span>'">`;
                case 'badge':
                    return `<div class="card-badge" style="background:${card.item.color};">${card.item.v}</div>`;
                default:
                    return `<span class="card-emoji">${card.item.v}</span>`;
            }
        }

        function flipCard(card) {
            if (isChecking) return;
            if (card.classList.contains('matched')) return;
            if (card.classList.contains('revealed')) return;
            if (flipped.length >= 2) return;

            card.classList.add('revealed');
            if (card.dataset.type === 'word') speakWord(card.dataset.word);
            flipped.push(card);

            if (flipped.length === 2) {
                isChecking = true;
                setTimeout(checkPair, 700);
            }
        }

        function checkPair() {
            const [a, b] = flipped;
            if (a.dataset.pair === b.dataset.pair) {
                a.classList.add('matched');
                b.classList.add('matched');
                playSfx('correct');
                score += 10; matchedCount++;
                document.getElementById('score').innerText = score;
                document.getElementById('pairs-found').innerText = matchedCount;
                flipped = []; isChecking = false;
                if (matchedCount === totalPairs) {
                    clearInterval(timerInterval);
                    setTimeout(() => finishGame(true), 500);
                }
            } else {
                playSfx('wrong');
                setTimeout(() => {
                    a.classList.remove('revealed');
                    b.classList.remove('revealed');
                    flipped = []; isChecking = false;
                }, 500);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 120;
            document.getElementById('time-left').innerText = timeLeft;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').innerText = timeLeft;
                if (timeLeft <= 0) { clearInterval(timerInterval); finishGame(false); }
            }, 1000);
        }

        function stopGame() { clearInterval(timerInterval); finishGame(false); }

        function finishGame(allFound) {
            document.getElementById('result-title').innerText =
                allFound ? 'Semua ditemukan! 🎉' : 'Waktu Habis! ⏰';
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-pairs').innerText =
                `Pasangan ditemukan: ${matchedCount} / ${totalPairs}`;
            showScreen('screen-result');
        }

        function speakWord(word) {
            if (!isAudioEnabled) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(word);
            u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.2;
            window.speechSynthesis.speak(u);
        }
    </script>
</body>
</html>
