<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Body</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .top-bar {
            display: flex;
            align-items: center;
            max-width: 560px;
            margin: 0 auto 10px auto;
        }
        .btn-back {
            background-color: #c7ceea;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #a0a8c8;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: #333;
        }
        .btn-back:active { transform: translateY(4px); box-shadow: none; }
        .btn-home {
            background-color: #ffd166;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #ccaa33;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: #333;
        }
        .btn-home:active { transform: translateY(4px); box-shadow: none; }
        h1 {
            color: #ff6b6b;
            font-size: 28px;
            margin: 0;
            flex: 1;
        }
        .subtitle {
            color: #777;
            font-size: 15px;
            margin: 0 0 16px 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 560px;
            margin: 0 auto;
        }
        .card {
            background-color: white;
            border: 3px solid #4ecdc4;
            border-radius: 16px;
            padding: 14px 8px;
            cursor: pointer;
            box-shadow: 0 5px 0 #36b2aa;
            transition: transform 0.1s, box-shadow 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .card:active { transform: translateY(5px); box-shadow: none; }
        .card.playing {
            border-color: #ff6b6b;
            box-shadow: 0 5px 0 #cc4444;
            background-color: #fff5f5;
        }
        .card img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            display: block;
            margin: 0 auto 8px auto;
        }
        .card .placeholder {
            width: 64px;
            height: 64px;
            background-color: #eee;
            border-radius: 10px;
            margin: 0 auto 8px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 11px;
        }
        .card p {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            max-width: 560px;
            margin: 20px auto 0 auto;
        }
        .btn-page {
            background-color: #4ecdc4;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 22px;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #36b2aa;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-page:active { transform: translateY(4px); box-shadow: none; }
        .btn-page:disabled {
            background-color: #ccc;
            box-shadow: 0 4px 0 #aaa;
            cursor: default;
        }
        .page-indicator {
            font-size: 16px;
            color: #555;
            font-weight: bold;
            min-width: 80px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="btn-back" href="../">⬅ Back</a>
        <h1>My Body</h1>
        <a class="btn-home" href="../../../../">Home</a>
    </div>
    <p class="subtitle">How to pronounce these words? Tap a card!</p>

    <div class="grid" id="grid"></div>

    <div class="pagination">
        <button class="btn-page" id="btn-prev" onclick="changePage(-1)">◀</button>
        <span class="page-indicator" id="page-indicator"></span>
        <button class="btn-page" id="btn-next" onclick="changePage(1)">▶</button>
    </div>

    <script>
        const words = [
            { word: 'head',      emoji: '🗣️', img: 'https://img.icons8.com/color/96/head.png' },
            { word: 'hair',      emoji: '💇', img: 'https://img.icons8.com/color/96/hair.png' },
            { word: 'eyes',      emoji: '👀', img: 'https://img.icons8.com/color/96/eye.png' },
            { word: 'ears',      emoji: '👂', img: 'https://img.icons8.com/color/96/ear.png' },
            { word: 'nose',      emoji: '👃', img: 'https://img.icons8.com/color/96/nose.png' },
            { word: 'mouth',     emoji: '👄', img: 'https://img.icons8.com/color/96/mouth.png' },
            { word: 'cheek',     emoji: '😊', img: 'https://img.icons8.com/color/96/cheek.png' },
            { word: 'chin',      emoji: '🧔', img: 'https://img.icons8.com/color/96/chin.png' },
            { word: 'neck',      emoji: '🧣', img: 'https://img.icons8.com/color/96/neck.png' },
            { word: 'shoulders', emoji: '🤷', img: 'https://img.icons8.com/color/96/shoulder.png' },
            { word: 'elbow',     emoji: '💪', img: 'https://img.icons8.com/color/96/elbow.png' },
            { word: 'fingers',   emoji: '☝️', img: 'https://img.icons8.com/color/96/finger.png' },
            { word: 'hands',     emoji: '🤲', img: 'https://img.icons8.com/color/96/hand.png' },
            { word: 'stomach',   emoji: '🫃', img: 'https://img.icons8.com/color/96/stomach.png' },
            { word: 'knees',     emoji: '🦵', img: 'https://img.icons8.com/color/96/knee.png' },
            { word: 'legs',      emoji: '🦵', img: 'https://img.icons8.com/color/96/leg.png' },
            { word: 'toes',      emoji: '🦶', img: 'https://img.icons8.com/color/96/toes.png' },
            { word: 'feet',      emoji: '🦶', img: 'https://img.icons8.com/color/96/foot.png' },
            { word: 'foot',      emoji: '🦶', img: 'https://img.icons8.com/color/96/foot.png' },
        ];

        const PER_PAGE = 6;
        let currentPage = 0;
        const totalPages = Math.ceil(words.length / PER_PAGE);

        function renderPage() {
            const grid = document.getElementById('grid');
            const start = currentPage * PER_PAGE;
            const pageWords = words.slice(start, start + PER_PAGE);

            grid.innerHTML = pageWords.map(item => `
                <div class="card" data-word="${item.word}">
                    <img src="${item.img}" alt="${item.word}"
                         onerror="this.outerHTML='<span style=\\'font-size:52px;display:block;text-align:center;margin:0 auto 8px\\'>${item.emoji}</span>'">
                    <p>${item.word.charAt(0).toUpperCase() + item.word.slice(1)}</p>
                </div>
            `).join('');

            grid.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', () => speak(card.dataset.word, card));
            });

            document.getElementById('page-indicator').textContent =
                `${currentPage + 1} / ${totalPages}`;
            document.getElementById('btn-prev').disabled = currentPage === 0;
            document.getElementById('btn-next').disabled = currentPage === totalPages - 1;
        }

        function changePage(dir) {
            currentPage += dir;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function speak(word, card) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 1.2;
            card.classList.add('playing');
            utterance.onend = () => card.classList.remove('playing');
            utterance.onerror = () => card.classList.remove('playing');
            window.speechSynthesis.speak(utterance);
        }

        renderPage();
    </script>
</body>
</html>
