<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alphabet A–Z</title>
    <link rel="stylesheet" href="../../../../assets/shared.css">
    <style>
        .subtitle {
            color: #777;
            font-size: 15px;
            margin: 0 0 16px 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 560px;
            margin: 0 auto;
        }
        .card .upper {
            font-size: 34px;
            font-weight: bold;
            color: #ff6b6b;
            display: block;
            line-height: 1;
        }
        .card .lower {
            font-size: 22px;
            font-weight: bold;
            color: #4ecdc4;
            display: block;
            line-height: 1.2;
        }
    </style>
</head>
<body data-theme="english">
    <div id="topbar"></div>
    <script src="../../../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'Alphabet A–Z', backHref: '../', homeHref: '../../../../', audio: true });
    </script>
    <p class="subtitle">How to say these letters? Tap a card!</p>

    <div class="grid" id="grid"></div>

    <div class="pagination">
        <button class="btn-page" id="btn-prev" onclick="changePage(-1)">◀</button>
        <span class="page-indicator" id="page-indicator"></span>
        <button class="btn-page" id="btn-next" onclick="changePage(1)">▶</button>
    </div>

    <script>
        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

        const PER_PAGE = 10;
        let currentPage = 0;
        const totalPages = Math.ceil(letters.length / PER_PAGE);

        function renderPage() {
            const grid = document.getElementById('grid');
            const pageLetters = letters.slice(currentPage * PER_PAGE, (currentPage + 1) * PER_PAGE);

            grid.innerHTML = pageLetters.map(L => `
                <div class="card card--leaf" data-letter="${L}">
                    <span class="upper">${L}</span>
                    <span class="lower">${L.toLowerCase()}</span>
                </div>
            `).join('');

            grid.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', () => speak(card.dataset.letter, card));
            });

            document.getElementById('page-indicator').textContent = `${currentPage + 1} / ${totalPages}`;
            document.getElementById('btn-prev').disabled = currentPage === 0;
            document.getElementById('btn-next').disabled = currentPage === totalPages - 1;
        }

        function changePage(dir) {
            currentPage += dir;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function speak(letter, card) {
            if (!isAudioEnabled) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(letter);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 1.2;
            card.classList.add('playing');
            utterance.onend = () => card.classList.remove('playing');
            utterance.onerror = () => card.classList.remove('playing');
            window.speechSynthesis.speak(utterance);
        }

        renderPage();
    </script>
</body>
</html>
