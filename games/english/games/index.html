<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Games</title>
    <link rel="stylesheet" href="../../../assets/shared.css">
    <style>
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body data-theme="english">
    <div id="topbar"></div>
    <script src="../../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'English Games', backHref: '../', homeHref: '../../../' });
    </script>
    <div class="grid">
        <a class="card card--hub" href="./listen-tap/">
            <img src="https://img.icons8.com/color/96/speaker.png" alt="Listen & Tap"
                 onerror="this.style.display='none'">
            <p>Listen & Tap</p>
        </a>
        <a class="card card--hub" href="./memory/">
            <img src="https://img.icons8.com/color/96/cards.png" alt="Memory Game"
                 onerror="this.style.display='none'">
            <p>Memory Game</p>
        </a>
    </div>
</body>
</html>
