<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English</title>
    <link rel="stylesheet" href="../../assets/shared.css">
    <style>
        .subtitle {
            color: #888;
            font-size: 15px;
            margin: 0 0 24px 0;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 560px;
            margin: 0 auto;
        }
    </style>
</head>
<body data-theme="english">
    <div id="topbar"></div>
    <script src="../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'English', backHref: '../../', homeHref: '../../' });
    </script>
    <p class="subtitle">Choose a topic</p>

    <div class="grid">
        <a class="card card--hub" href="./words/">
            <img src="https://img.icons8.com/color/96/open-book.png" alt="Words"
                 onerror="this.style.display='none'">
            <p>Words</p>
            <small>Vocabulary & pronunciation</small>
        </a>
        <a class="card card--hub" href="./conversation/">
            <img src="https://img.icons8.com/color/96/chat.png" alt="Conversation"
                 onerror="this.style.display='none'">
            <p>Conversation</p>
            <small>Greetings & phrases</small>
        </a>
    </div>
</body>
</html>
