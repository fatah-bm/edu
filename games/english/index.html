<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 16px;
            text-align: center;
            min-height: 100vh;
        }
        .top-bar {
            display: flex;
            align-items: center;
            max-width: 560px;
            margin: 0 auto 10px auto;
        }
        .btn-back {
            background-color: #c7ceea;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #a0a8c8;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: #333;
        }
        .btn-back:active { transform: translateY(4px); box-shadow: none; }
        .btn-home {
            background-color: #ffd166;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #ccaa33;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: #333;
        }
        .btn-home:active { transform: translateY(4px); box-shadow: none; }
        h1 {
            color: #4ecdc4;
            font-size: 28px;
            margin: 0;
            flex: 1;
        }
        .subtitle {
            color: #888;
            font-size: 15px;
            margin: 0 0 24px 0;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 560px;
            margin: 0 auto;
        }
        .card {
            background-color: white;
            border: 4px solid #4ecdc4;
            border-radius: 20px;
            padding: 20px 16px;
            width: 160px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 6px 0 #36b2aa;
            transition: transform 0.1s, box-shadow 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .card:active { transform: translateY(6px); box-shadow: none; }
        .card img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px auto;
        }
        .card p {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }
        .card small {
            display: block;
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="btn-back" href="../../">⬅ Back</a>
        <h1>English</h1>
        <a class="btn-home" href="../../">Home</a>
    </div>
    <p class="subtitle">Choose a topic</p>

    <div class="grid">
        <a class="card" href="./words/">
            <img src="https://img.icons8.com/color/96/open-book.png" alt="Words"
                 onerror="this.style.display='none'">
            <p>Words</p>
            <small>Vocabulary & pronunciation</small>
        </a>
        <a class="card" href="./conversation/">
            <img src="https://img.icons8.com/color/96/chat.png" alt="Conversation"
                 onerror="this.style.display='none'">
            <p>Conversation</p>
            <small>Greetings & phrases</small>
        </a>
    </div>
</body>
</html>
