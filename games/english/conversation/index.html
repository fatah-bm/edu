<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conversation</title>
    <link rel="stylesheet" href="../../../assets/shared.css">
    <style>
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 560px;
            margin: 0 auto;
        }
        .card .emoji { font-size: 52px; display: block; margin-bottom: 10px; }
    </style>
</head>
<body data-theme="english">
    <div id="topbar"></div>
    <script src="../../../assets/shared.js"></script>
    <script>
        initTopBar({ title: 'Conversation', backHref: '../', homeHref: '../../../' });
    </script>
    <div class="grid">
        <a class="card card--hub" href="./greetings/">
            <span class="emoji">👋</span>
            <p>Greetings</p>
            <small>Hello & goodbye</small>
        </a>
        <a class="card card--hub" href="./do-you-have/">
            <span class="emoji">🤔</span>
            <p>Do You Have?</p>
            <small>Yes, I do / No, I don't</small>
        </a>
        <a class="card card--hub" href="./what-time/">
            <span class="emoji">🕐</span>
            <p>What Time Is It?</p>
            <small>O'clock</small>
        </a>
    </div>
</body>
</html>
