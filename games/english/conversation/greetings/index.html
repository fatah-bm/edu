<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Greetings</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 15px;
        }
        .top-bar {
            display: flex;
            align-items: center;
            max-width: 480px;
            margin: 0 auto 16px auto;
        }
        .btn-back, .btn-home {
            border: none;
            border-radius: 12px;
            padding: 8px 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: #333;
        }
        .btn-back { background-color: #c7ceea; box-shadow: 0 4px 0 #a0a8c8; }
        .btn-home { background-color: #ffd166; box-shadow: 0 4px 0 #ccaa33; }
        .btn-back:active, .btn-home:active { transform: translateY(4px); box-shadow: none; }
        h1 { color: #9b59b6; font-size: 24px; margin: 0; flex: 1; text-align: center; }

        .situation-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .situation-header .emoji { font-size: 64px; display: block; }
        .situation-header h2 { color: #2c3e50; font-size: 20px; margin: 8px 0 0; }

        .dialog {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 480px;
            margin: 0 auto;
            padding: 0 8px;
        }
        .bubble-wrap {
            display: flex;
        }
        .bubble-wrap.A { justify-content: flex-start; }
        .bubble-wrap.B { justify-content: flex-end; }
        .bubble {
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            max-width: 82%;
            line-height: 1.4;
            transition: opacity 0.15s, transform 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
        }
        .bubble:active { transform: translateY(3px); box-shadow: none; }
        .bubble.playing { opacity: 0.55; }
        .bubble::before { content: '🔊 '; font-size: 0.9em; opacity: 0.75; }
        .bubble.A {
            background-color: #3498db;
            color: white;
            border-bottom-left-radius: 4px;
        }
        .bubble.B {
            background-color: #2ecc71;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .label {
            font-size: 11px;
            font-weight: bold;
            color: #aaa;
            margin-bottom: 3px;
        }
        .bubble-wrap.A .label { text-align: left; padding-left: 4px; }
        .bubble-wrap.B .label { text-align: right; padding-right: 4px; }
        .bubble-col { display: flex; flex-direction: column; max-width: 82%; }
        .bubble-col.B { align-items: flex-end; }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            max-width: 480px;
            margin: 28px auto 0 auto;
        }
        .btn-page {
            background-color: #9b59b6;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 22px;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #7d3c98;
            touch-action: manipulation;
        }
        .btn-page:active { transform: translateY(4px); box-shadow: none; }
        .btn-page:disabled { background-color: #ccc; box-shadow: 0 4px 0 #aaa; cursor: default; }
        .page-indicator { font-size: 16px; color: #555; font-weight: bold; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="btn-back" href="../">⬅ Back</a>
        <h1>Greetings</h1>
        <a class="btn-home" href="../../../../">Home</a>
    </div>

    <div class="situation-header">
        <span class="emoji" id="sit-emoji"></span>
        <h2 id="sit-title"></h2>
    </div>

    <div class="dialog" id="dialog"></div>

    <div class="pagination">
        <button class="btn-page" id="btn-prev" onclick="changePage(-1)">◀</button>
        <span class="page-indicator" id="page-indicator"></span>
        <button class="btn-page" id="btn-next" onclick="changePage(1)">▶</button>
    </div>

    <script>
        const situations = [
            { emoji: '🌅', title: 'Good Morning', dialog: [
                { side: 'A', text: 'Good morning!' },
                { side: 'B', text: 'Good morning!' },
            ]},
            { emoji: '☀️', title: 'Good Afternoon', dialog: [
                { side: 'A', text: 'Good afternoon!' },
                { side: 'B', text: 'Good afternoon!' },
            ]},
            { emoji: '🌆', title: 'Good Evening', dialog: [
                { side: 'A', text: 'Good evening!' },
                { side: 'B', text: 'Good evening!' },
            ]},
            { emoji: '🌙', title: 'Good Night', dialog: [
                { side: 'A', text: 'Good night!' },
                { side: 'B', text: 'Good night!' },
            ]},
            { emoji: '😊', title: 'How Are You?', dialog: [
                { side: 'A', text: 'How are you?' },
                { side: 'B', text: "I'm fine, thank you!" },
                { side: 'A', text: "That's great!" },
            ]},
            { emoji: '🤝', title: 'Nice to Meet You', dialog: [
                { side: 'A', text: 'Nice to meet you!' },
                { side: 'B', text: 'Nice to meet you too!' },
            ]},
            { emoji: '👋', title: 'See You', dialog: [
                { side: 'A', text: 'See you!' },
                { side: 'B', text: 'See you!' },
            ]},
        ];

        let currentPage = 0;

        function renderPage() {
            const sit = situations[currentPage];
            document.getElementById('sit-emoji').textContent = sit.emoji;
            document.getElementById('sit-title').textContent = sit.title;

            const dialog = document.getElementById('dialog');
            dialog.innerHTML = sit.dialog.map((line, i) => `
                <div class="bubble-wrap ${line.side}">
                    <div class="bubble-col ${line.side}">
                        <div class="label">${line.side === 'A' ? 'You' : 'Friend'}</div>
                        <div class="bubble ${line.side}" data-text="${line.text}" data-person="${line.side}">${line.text}</div>
                    </div>
                </div>
            `).join('');

            dialog.querySelectorAll('.bubble').forEach(b => {
                b.addEventListener('click', () => speak(b.dataset.text, b, b.dataset.person));
            });

            document.getElementById('page-indicator').textContent = `${currentPage + 1} / ${situations.length}`;
            document.getElementById('btn-prev').disabled = currentPage === 0;
            document.getElementById('btn-next').disabled = currentPage === situations.length - 1;
        }

        function changePage(dir) {
            currentPage += dir;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        let voiceA = null, voiceB = null;
        const femaleNames = ['zira', 'samantha', 'karen', 'moira', 'fiona', 'allison', 'ava',
                             'victoria', 'female', 'woman', 'susan', 'hazel', 'heera', 'neerja',
                             'google uk english female', 'google us english'];
        function loadVoices() {
            const all = window.speechSynthesis.getVoices();
            const en = all.filter(v => v.lang.startsWith('en'));
            if (en.length === 0) return;
            voiceA = en.find(v => femaleNames.some(k => v.name.toLowerCase().includes(k))) || en[0];
            voiceB = en.find(v => v !== voiceA) || voiceA;
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function speak(text, el, person = 'A') {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            if (person === 'B') {
                u.voice = voiceB;
                u.rate = 0.9;
                u.pitch = 1.9;
            } else {
                u.voice = voiceA;
                u.rate = 0.85;
                u.pitch = 1.0;
            }
            el.classList.add('playing');
            u.onend = () => el.classList.remove('playing');
            u.onerror = () => el.classList.remove('playing');
            window.speechSynthesis.speak(u);
        }

        renderPage();
    </script>
</body>
</html>
